/* ENGINE: Pure rules over the database. Numeric 0/1 and PRNG/hash constants are
   structural arithmetic only; all probabilities, tuning, limits and content live in DB. */
'use strict';
const FootballCore = (() => {
  const clone = value => JSON.parse(JSON.stringify(value));
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const sum = list => list.reduce((total, value) => total + value, 0);
  const mean = list => list.length ? sum(list) / list.length : 0;
  const hash = value => { let h = 2166136261; for (const c of String(value)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const random = seed => { let a = seed >>> 0; return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  const range = (rng, min, max) => min + rng() * (max - min);
  const integer = (rng, min, max) => Math.floor(range(rng, min, max + 1));
  const pick = (rng, list) => list[Math.floor(rng() * list.length)];
  const weighted = (rng, list, weight) => { const total = sum(list.map(weight)); if (!total) return pick(rng,list); let target = rng() * total; return list.find(item => (target -= weight(item)) < 0) || list.at(-1); };
  const dateAdd = (date, days) => { const d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().split('T')[0]; };
  const indexCache=new WeakMap();
  const indexes = (db,state=null) => {const key=state?.world||db;let result=indexCache.get(key);if(!result){result={clubs:Object.fromEntries(db.clubs.map(x=>[x.id,{...x,...state?.world?.clubs?.[x.id]}])),leagues:Object.fromEntries(db.leagues.map(x=>[x.id,x])),positions:Object.fromEntries(db.positions.map(x=>[x.id,x]))};indexCache.set(key,result);}return result;};
  const overall = (db, stats) => mean(db.attributes.map(a => stats[a.id]));
  const suitability = (db, player) => { const pos = db.positions.find(x=>x.id===player.position); return sum(db.attributes.map(a=>player.stats[a.id]*(pos.weights[a.id]||0))); };

  for(const l of db.leagues){if(db.clubs.filter(c=>c.league===l.id).length<2||l.salaryBase<=0)throw Error(`leagues.${l.id}`);const firsts=db.names.firstNamesByCountry[l.country]||db.engine.firstNames,lasts=db.engine.lastNames[l.country]||db.engine.lastNames.default;if(new Set(firsts).size*new Set(lasts).size<db.rules.squadSize)throw Error('names.squadSize');}

  for(const route of db.routes){if(route.id!=='domestic'){requireRef(route.league,refs.leagues,'routes.league');if(!db.clubs.some(c=>c.league===route.league&&c.quality<=route.qualityMax))throw Error('routes.qualityMax');}}
  for(const required of DEFAULT_DB.routes.map(r=>r.id))if(!db.routes.some(r=>r.id===required))throw Error('routes');
  for(const c of db.countries){const route=db.routes.find(r=>r.id==='domestic');if(!db.clubs.some(club=>club.league===c.league&&club.quality<=route.qualityMax))throw Error('countries.domesticClub');}
  for(const a of db.attributes)if(a.initial<db.profile.limits.statMin||a.initial>db.profile.limits.statMax)throw Error('attributes.initial');
  for(const key of ['age','height','weight','number','stat'])if(db.profile.limits[`${key}Min`]>db.profile.limits[`${key}Max`])throw Error('profile.limits');
  for(const config of [db.engine.selection,db.engine.possession,db.engine.passing,db.engine.shot,db.engine.defense])for(const [key,value] of Object.entries(config))if(/Chance$|Share$|Accuracy$/.test(key)&&typeof value==='number'&&(value<0||value>1))throw Error(`engine.${key}`);

  for(const training of db.training)if(training.attribute&&!db.attributes.some(a=>a.id===training.attribute))throw Error('training.attribute');

  requireRef(db.profile.defaults.position,refs.positions,'profile.defaults.position');if(db.profile.defaults.preferredLeague!==db.profile.unspecifiedId)requireRef(db.profile.defaults.preferredLeague,refs.leagues,'profile.defaults.preferredLeague');if(db.profile.defaults.dreamClub!==db.profile.unspecifiedId)requireRef(db.profile.defaults.dreamClub,refs.clubs,'profile.defaults.dreamClub');
  if(!db.countries.some(c=>c.id===db.profile.defaults.country)||!db.profile.feet.some(f=>f.id===db.profile.defaults.foot))throw Error('profile.defaults');
  for(const key of ['traits','personalities','growthTypes','tactics','worldViews','characterTraits','clubTiers','identityStyles']){const ids=db[key].map(x=>x.id);if(new Set(ids).size!==ids.length||DEFAULT_DB[key].some(item=>!ids.includes(item.id)))throw Error(key);}
  for(const c of db.clubs)if(!db.clubTiers.some(x=>x.id===c.prestigeTier)||c.prestige<0||c.prestige>db.rules.scale)throw Error('clubs.prestige');for(const c of db.profile.dreamClubs)if(c.id!==db.profile.unspecifiedId)requireRef(c.id,refs.clubs,'profile.dreamClubs');for(const l of db.profile.preferredLeagues)if(l.id!==db.profile.unspecifiedId)requireRef(l.id,refs.leagues,'profile.preferredLeagues');for(const trait of db.characterTraits)for(const [id,weight] of Object.entries(trait.growthWeights))if(!db.growthTypes.some(t=>t.id===id)||weight<0)throw Error('characterTraits');
  const tactics=new Set(db.tactics.map(x=>x.id)),traits=new Set(db.traits.map(x=>x.id));
  for(const tactic of db.tactics){if(tactic.formation.length!==db.engine.formation.length||tactic.formation.filter(x=>x==='GK').length!==1)throw Error('tactics.formation');for(const id of tactic.formation)requireRef(id,refs.positions,'tactics.position');}
  for(const pair of db.worldConfig.promotionPairs){requireRef(pair.lower,refs.leagues,'promotion.lower');requireRef(pair.upper,refs.leagues,'promotion.upper');if(pair.lower===pair.upper)throw Error('promotion');}
  for(const weights of Object.values(db.dynamics.execution))for(const [id,weight] of Object.entries(weights))if(!traits.has(id)||weight<0)throw Error('dynamics.execution');
  for(const type of db.growthTypes)if(type.curve.some((x,i)=>x.rate<0||(i&&x.age<=type.curve[i-1].age)))throw Error('growthTypes.curve');
  for(const trend of db.dynamics.trends)if(!tactics.has(trend.tactic))throw Error('trends.tactic');
  for(const t of db.traits)if(t.min>t.max||t.initial<t.min||t.initial>t.max||t.step<=0)throw Error('traits.range');
  for(const key of ['traitUnit','experienceTargetMinutes','environmentUnit','potentialOffset','positionRanks','worldTableLimit','coachingFinanceScale'])if(db.dynamics[key]<=0)throw Error('dynamics.'+key);
  if(db.dynamics.roleWeights.length!==db.dynamics.positionRanks)throw Error('roleWeights');
  for(const w of db.dynamics.roleWeights)if(w<=0||w>1)throw Error('roleWeights');
  if(career){requireRef(career.player.club,refs.clubs,'player.club');if(career.player.dreamClub!==db.profile.unspecifiedId)requireRef(career.player.dreamClub,refs.clubs,'player.dreamClub');requireRef(career.player.position,refs.positions,'player.position');if(career.player.preferredLeague!==db.profile.unspecifiedId)requireRef(career.player.preferredLeague,refs.leagues,'player.preferredLeague');if(!db.countries.some(c=>c.id===career.player.country)||!db.training.some(x=>x.id===career.training))throw Error('player.references');for(const league of Object.keys(career.fixtures)){requireRef(league,refs.leagues,'fixtures.league');for(const f of career.fixtures[league]){requireRef(f.home,refs.clubs,'fixtures.home');requireRef(f.away,refs.clubs,'fixtures.away');if((career.world?.clubs[f.home]?.league||refs.clubs[f.home].league)!==league||(career.world?.clubs[f.away]?.league||refs.clubs[f.away].league)!==league)throw Error('fixtures.club.league');}}for(const record of career.player.history){requireRef(record.club,refs.clubs,'history.club');requireRef(record.home,refs.clubs,'history.home');requireRef(record.away,refs.clubs,'history.away');}for(const entry of career.player.career)requireRef(entry.club,refs.clubs,'career.club');for(const offer of career.offers)requireRef(offer.club,refs.clubs,'offers.club');}
  return true;
}

  document.getElementById('app').innerHTML=`<aside class="sidebar" id="sidebar"><div class="logo"><span class="logo-mark">XI</span><div>${h(DB.meta.title)}<small>${h(DB.meta.subtitle)}</small></div></div><div class="career-mini"><div class="row"><span class="avatar">${h(p.name.slice(0,1))}</span><div><b>${h(p.name)}</b><p>${h(p.position)} · ${n(p.age)}${h(t('ageUnit'))}</p></div></div><div class="divider"></div><p>${h(club.name)}</p></div><div class="nav-caption">${h(t('navigation'))}</div><nav class="nav" aria-label="${h(t('navigation'))}">${DB.ui.tabs.map(x=>`<button type="button" data-action="tab" data-tab="${h(x.id)}" class="${screen===x.id?'active':''}" ${screen===x.id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${h(x.icon)}</span>${h(x.label)}</button>`).join('')}</nav><footer class="sidebar-footer">${h(DB.meta.title)} / v${h(DB.meta.version)}${btn(t('dbEdit'),'db','','subtle')}${btn(t('newCareer'),'new','','subtle')}</footer></aside><main class="shell"><header class="topbar"><div class="row">${btn('☰','menu','','mobile-menu')}<div><p>${h(league.name)} · ${h(t('season',{n:state.season}))} · ${h(state.date)}</p><h2>${h(tab.label)}</h2></div></div><div class="top-actions">${btn(t('export'),'export','','subtle')}${btn(t('import'),'import','','subtle')}${btn(t('save'),'save')}${btn(t(finished?'nextSeason':'continue'),finished?'next-season':'advance','','primary')}</div></header><div class="content">${!storageHealthy?`<div class="notice warning" style="margin-bottom:18px">${h(t('saveWarning'))}</div>`:''}${({dashboard:dashboard,fixtures:fixtures,statistics:statistics,team:team,market:market,career:career,development:development,world:world,news:news}[screen]||dashboard)()}</div></main>`;
}
function baseDashboard(){const p=state.player,club=currentClub(),tot=Core.totals(DB,myHistory()),fixture=nextFixture(),chance=Core.selection(DB,state)*DB.rules.scale,comp=Core.competition(DB,p,p.club,state),dream=idx().clubs[p.dreamClub]||{name:t('undecided'),color:DB.profile.unspecifiedColor,quality:DB.rules.scale},fit=Core.suitability(DB,p),route=DB.routes.find(x=>x.id===p.route);return `<div class="welcome"><div class="eyebrow">${h(t('currentClub'))} / ${h(club.name)}</div><h1>${h(t('welcome',{name:p.name}))}</h1><p>${h(t('welcomeSub'))}</p></div><div class="cols"><div class="stack"><section class="card hero"><div class="hero-profile">${shirt(p.number)}<div>${badge(p.position)}<h2>${h(p.name)}</h2><p>${h(DB.countries.find(c=>c.id===p.country).name)} · ${n(p.age)}${h(t('ageUnit'))} · ${n(p.height)} cm</p><div style="margin-top:12px">${badge(club.parent?route.name:t('currentClub'),'pink')}</div></div></div><div class="hero-score"><span>${h(t('overall'))}</span><strong class="num">${n(Core.overall(DB,p.stats),1)}</strong><p>${h(t('roleOverall'))} ${n(fit,1)}</p></div></section><div class="kpi-grid">${kpi(t('apps'),`${tot.apps}`,`${t('starts')} ${tot.starts} · ${tot.minutes}${t('minutesShort')}`)}${kpi(t('goal'),n(tot.goals),`${t('xg')} ${n(tot.xg,2)}`)}${kpi(t('assist'),n(tot.assists),`${t('xa')} ${n(tot.xa,2)}`)}${kpi(t('avgRating'),tot.apps?n(tot.rating,2):t('noRating'),t('seasonStats'))}</div><section class="card"><div class="section-head"><h2>${h(t('coachReport'))}</h2>${badge(p.injury?t('injured',{n:p.injury}):p.suspension?t('suspended',{n:p.suspension}):t(chance>=DB.competitionRules.roleStarterChance?'roleStarter':chance>=DB.competitionRules.roleRotationChance?'roleRotation':'roleBackup'),p.injury||p.suspension?'red':'green')}</div><p class="small muted">${h(t('coachReportText',{competition:n(comp,1),chance:n(chance)}))}</p><div class="form-grid" style="margin-top:20px">${['trust','fitness','morale','reputation'].map(key=>`<div><div class="row between small" style="margin-bottom:7px"><span class="muted">${h(t(key))}</span><b class="num">${n(p[key])}/${DB.rules.scale}</b></div>${progress(p[key])}</div>`).join('')}</div>${p.fitness<DB.rules.minimumFitnessForSelection?`<div class="notice warning" style="margin-top:20px">${h(t('lowFitness'))}</div>`:''}</section><section class="card"><div class="section-head"><h2>${h(t('recentMatches'))}</h2>${btn(t('viewAll'),'tab','data-tab="fixtures"','subtle')}</div>${historyItems(myHistory().slice(-DB.rules.recentFormMatches))}</section></div><div class="stack"><section class="card"><div class="section-head"><h2>${h(t('nextFixture'))}</h2>${fixture?badge(t('round',{n:fixture.round+1})):badge(t('endSeason'),'pink')}</div>${fixture?`<p class="small muted">${h(idx().leagues[club.league].name)}</p>${fixtureCard(fixture)}<div class="divider"></div>${detail(t('selection'),`${n(chance)}% ${t('starter')}`)}${detail(t('fitness'),`${n(p.fitness)}/${DB.rules.scale}`)}`:`<div class="notice">${h(t('seasonFinished'))}</div>`}</section><section class="card"><div class="section-head"><h2>${h(t('training'))}</h2>${badge(n(Core.suitability(DB,p),1))}</div><div class="training-list">${DB.training.map(tr=>btn(tr.name,'training',`data-id="${h(tr.id)}" aria-pressed="${tr.id===state.training}"`,tr.id===state.training?'selected':'')).join('')}</div><p class="small muted" style="margin-top:12px">${h(DB.training.find(tr=>tr.id===state.training).description)}</p><div class="divider"></div><p class="small muted">${h(t('trainingHint'))}</p></section><section class="card"><div class="section-head"><h2>${h(t('dream'))}</h2>${crest(dream)}</div><h3>${h(dream.name)}</h3><p class="small muted" style="margin:7px 0 15px">${h(t(p.dreamClub===DB.profile.unspecifiedId?'undecidedDream':'dreamHint'))}</p>${p.dreamClub===DB.profile.unspecifiedId?'':progress(fit,dream.quality)+`<div class="row between small" style="margin-top:10px"><span class="muted">${h(t('abilityGap'))}</span><b class="num">${n(Math.max(0,dream.quality-fit),1 function fixtures(){if(reportId){const record=state.player.history.find(x=>x.id===reportId);if(record)return report(record);}const league=currentClub().league,upcoming=state.fixtures[league].filter(f=>f.round>=state.round&&(f.home===state.player.club||f.away===state.player.club));return `<div class="tabs-inline">${btn(t('history'),'fixture-scope','data-scope="history"',fixtureScope==='history'?'selected':'')}${btn(t('schedule'),'fixture-scope','data-scope="schedule"',fixtureScope==='schedule'?'selected':'')}</div><section class="card"><div class="section-head"><h2>${h(t(fixtureScope==='history'?'history':'schedule'))}</h2>${badge(t('season',{n:state.season}))}</div>${fixtureScope==='history'?historyItems(state.player.history):upcoming.length?`<div class="table-wrap"><table><thead><tr>${['round','date','opponent','competition'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${upcoming.map(f=>`<tr><td>${n(f.round+1)}</td><td>${h(f.date)}</td><td>${h(idx().clubs[f.home===state.player.club?f.away:f.home].name)} ${badge(t(f.home===state.player.club?'home':'away'))}</td><td>${h(idx().leagues[league].name)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${h(t('seasonFinished'))}</div>`}</section>`;}
function baseReport(record){const result=record.result,s=record.stats,i=idx(),r=result.player;return `<div class="section-head"><div><div class="eyebrow">${h(t('round',{n:record.round+1}))} / ${h(i.leagues[record.league].name)}</div><h1>${h(t('matchReport'))}</h1></div>${btn(t('history'),'report-close')}</div><section class="card" style="margin-bottom:20px">${fixtureCard(record,result)}<div class="row between wrap">${badge(t(record.appearance),record.appearance==='starter'?'green':'pink')}<span class="small muted">${h(t('minutes'))}: ${n(s.minutes)} / ${n(result.duration)} · ${h(t('season',{n:record.season}))}</span>${s.minutes?`<span class="rating">${h(t('avgRating'))} ${n(s.rating,1)}</span>`:''}</div></section><div class="cols"><div class="stack"><section class="card"><div class="section-head"><h2>${h(t('playerStats'))}</h2>${badge(state.player.name)}</div>${s.minutes?`<div class="form-grid">${DB.ui.statGroups.map(group=>`<section><h3 class="small" style="margin-bottom:8px;color:var(--accent)">${h(group.name)}</h3><div class="table-wrap"><table><tbody>${group.fields.map(key=>{const f=DB.ui.statFields.find(f=>f.id===key);return `<tr><td>${h(f.label)}</td><td class="right num">${n(Core.metric(DB,s,key),f.digits)} ${h(f.unit||'')}</td></tr>`;}).join('')}</tbody></table></div></section>`).join('')}</div><p class="small muted" style="margin-top:14px">${h(t('statNote'))}</p>`:`<div class="empty">${h(t('unused'))}</div>`}</section><section class="card"><h2 style="margin-bottom:16px">${h(t('lineups'))}</h2>${['home','away'].map(side=>`<h3 style="margin:18px 0 8px">${h(i.clubs[record[side]].name)}</h3><div class="table-wrap"><table><thead><tr>${['player','position','minutes','goal','assist','avgRating'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${result[side].players.map(p=>`<tr class="${p.id==='player'?'highlight':''}"><td>${h(p.name)}</td><td>${h(p.position)}</td><td>${n(p.match.minutes)}</td><td>${n(p.match.goals)}</td><td>${n(p.match.assists)}</td><td function statistics(){const records=statsScope==='all'?state.player.history:myHistory(),stats=Core.totals(DB,records),recent=records.filter(r=>r.stats.minutes>0).slice(-DB.rules.recentFormMatches);return `<div class="tabs-inline">${btn(t('seasonStats'),'stats-scope','data-scope="season"',statsScope==='season'?'selected':'')}${btn(t('allCareer'),'stats-scope','data-scope="all"',statsScope==='all'?'selected':'')}</div><div class="kpi-grid" style="margin-bottom:20px">${kpi(t('apps'),n(stats.apps),`${t('starts')} ${stats.starts}`)}${kpi(t('minutes'),n(stats.minutes),t('minutesShort'))}${kpi(t('goal'),n(stats.goals),`${t('assist')} ${stats.assists}`)}${kpi(t('avgRating'),stats.apps?n(stats.rating,2):t('noRating'),t('allCompetitions'))}</div><div class="cols equal"><section class="card"><div class="section-head"><h2>${h(t('recordSummary'))}</h2>${badge(t('databaseLabel'))}</div><div class="table-wrap"><table><tbody>${DB.ui.summaryFields.map(key=>{const field=DB.ui.statFields.find(f=>f.id===key);return `<tr><td>${h(field.label)}</td><td class="right num">${n(Core.metric(DB,stats,key),field.digits)} ${h(field.unit||'')}</td></tr>`;}).join('')}${detailTable(t('avgRating'),stats.apps?n(stats.rating,2):t('noRating'))}${detailTable(DB.ui.statFields.find(f=>f.id==='passAccuracy').label,`${n(Core.metric(DB,stats,'passAccuracy'),1)}%`)}</tbody></table></div></section><div class="stack"><section class="card"><h2 style="margin-bottom:18px">${h(t('per90'))}</h2>${stats.minutes?`<div class="detail-list">${DB.ui.per90Fields.map(key=>detail(DB.ui.statFields.find(f=>f.id===key).label,n(stats[key]*DB.rules.matchMinutes/stats.minutes,2))).join('')}</div>`:`<div class="empty">${h(t('noStats'))}</div>`}<p class="small muted" style="margin-top:18px">${h(t('statNote'))}</p></section><section class="card"><h2>${h(t('recentMatches'))}</h2>${recent.length?`<div class="sparkline" role="img" aria-label="${h(recent.map(r=>`${r.date}: ${n(r.stats.rating,1)}`).join(', '))}">${recent.map(r=>`<div class .competition(DB,p,p.club,state),1),chance:n(Core.selection(DB,state)*DB.rules.scale)}))}</p></section>`;}
function market(){const p=state.player,open=Core.windowOpen(DB,state),club=currentClub(),ability=Core.suitability(DB,p);return `<div class="welcome row between wrap"><div><h1>${h(t('scouting'))}</h1><p>${h(t('offerHint'))}</p></div>${badge(t(open?'windowOpen':'windowClosed'),open?'green':'pink')}</div><div class="kpi-grid" style="margin-bottom:20px">${kpi(t('marketValue'),money(Core.marketValue(DB,p,state)),club.name)}${kpi(t('weeklyWage'),money(p.contract.weekly),t('salaryAnnual')+' '+money(p.contract.weekly*DB.rules.annualSalaryWeeks))}${kpi(t('reputation'),n(p.reputation,1),`${DB.rules.scale}`)}${kpi(t('roleOverall'),n(ability,1),p.position)}</div><div class="notice" style="margin-bottom:20px">${h(t('windowHint',{n:DB.rules.initialWindowRounds}))}</div><section class="card"><div class="section-head"><h2>${h(t('offer'))}</h2>${badge(state.offers.length)}</div>${state.offers.length?`<div class="club-cards">${state.offers.map(offer=>{const c=idx().clubs[offer.club];return `<article class="card club-card"><div class="row">${crest(c)}<div><h3>${h(c.name)}</h3><p>${h(idx().leagues[c.league].name)}</p></div></div><div class="detail-list">${detail(t('weeklyWage'),money(offer.weekly))}${detail(t('contractLength'),t('years',{n:offer.years}))}${detail(t('quality'),n(c.quality))}${detail(t('teamReputation'),n(c.reputation))}</div><p>${h(t('expires',{n:Math.max(0,offer.expires-state.round)}))}</p><button type="button" class="primary" data-action="transfer" data-club="${h(c.id)}" ${open?'':'disabled'}>${h(t('transfer'))}</button></article>`;}).join('')}</div>`:`<div class="empty">${h(t('noOffers'))}</div>`}</section>${club.parent?`<section class="card" style="margin-top:20px"><div class="section-head"><h2>${h(t('callupTitle'))}</h2>${badge(idx().clubs[club.parent].name)}</div><p class="small muted">${h(t('callupHint',{apps:DB.rules.callupApps,overall:DB.rules.callupOverall,trust:DB.rules.callupTrust}))}</p>${Core.canCallup(DB,state)?`<div class="notice" style="margin-top:15px">${h(t('callupReady'))}</div>${btn(t('callup'),'callup',`data-club="${h(club.parent)}"`,'primary')}`:''}</section>`:''}<section class="card" style="margin-top:20px"><div class="section-head"><h2>${h(t('scouting'))}</h2>${badge(t('databaseLabel'))}</div><div class="table-wrap"><table><thead><tr>${['club','competition','clubPrestige','quality','teamReputation','selection'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${Object.values(idx().clubs).filter(c=>!c.parent&&c.id!==club.id).sort((a,b)=>a.quality-b.quality).map(c=>`<tr><td>${h(c.name)}</td><td>${h(idx().leagues[c.league].name)}</td><td>${h(clubTier(c))}</td><td>${n(c.quality)}</td><td>${n(c.reputation)}</td><td>${badge(t(c.quality<=ability+DB.rules.scoutingQualityGap+p.reputation*DB.rules.scoutingReputationFactor?'interested':'tooHigh'),c.quality<=ability?'green':'')}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:16px">${h(DB.meta.sampleNotice)}</p></section>`;}
function baseCareer(){const p=state.player,remaining=p.contract.expiresSeason-state.season;return `<div class="cols equal"><section class="card"><h2 style="margin-bottom:20px">${h(t('personalProfile'))}</h2><div class="hero-profile" style="margin-bottom:24px">${shirt(p.number)}<div><h1>${h(p.name)}</h1>${badge(`${p.position} · ${idx().positions[p.position].name}`)}</div></div><div class="detail-list">${detail(t('nationality'),DB.countries.find(c=>c.id===p.country).name)}${detail(t('age'),n(p.age))}${detail(t('height'),`${n(p.height)} cm`)}${detail(t('weight'),`${n(p.weight)} kg`)}${detail(t('foot'),DB.profile.feet.find(f=>f.id===p.foot).name)}${detail(t('preferredLeague'),wishName('league',p.preferredLeague))}${detail(t('dream'),wishName('club',p.dreamClub))}</div><div class="divider"></div><h2 style="margin-bottom:18px">${h(t('development'))}</h2><div class="detail-list">${DB.attributes.map(a=>`<div><div class="row between"><span class="small muted">${h(a.name)}</span><b class="num">${n(p.stats[a.id],1)} <span class="small" style="color:var(--green)">${p.stats[a.id]>=p.growthBaseline[a.id]?'+':''}${n(p.stats[a.id]-p.growthBaseline[a.id],1)}</span></b></div>${progress(p.stats[a.id])}</div>`).join('')}</div><p class="small muted" style="margin-top:18px">${h(t('growthHint'))}</p></section><div class="stack"><section class="card"><h2 style="margin-bottom:20px">${h(t('contractLength'))}</h2><div class="detail-list">${detail(t('currentClub'),currentClub().name)}${detail(t('weeklyWage'),money(p.contract.weekly))}${detail(t('salaryAnnual'),money(p.contract.weekly*DB.rules.annualSalaryWeeks))}${detail(t('remaining'),t('years',{n:remaining}))}${detail(t('earned'),money(p.earned))}${detail(t('marketValue'),money(Core.marketValue(DB,p,state)))}</div><div class="divider"></div><p class="small muted" style="margin-bottom:14px">${h(t('renewHint'))}</p><button type="button" data-action="renew" ${remaining<=1?'':'disabled'}>${h(t('renew'))}</button></section><section class="card"><h2 style="margin-bottom:16px">${h(t('careerHistory'))}</h2>${p.career.slice().reverse().map(entry=>`<div class="history-item"><div>${badge(t(entry.type))}</div><div><b>${h(idx().clubs[entry.club].name)}</b><p>${h(entry.date)}</p></div><span class="small muted">${h(t('season',{n:entry.season}))}</span></div>`).join('')}</section></div></div>`;}
function dbEditor(){openModal(`<h2 id="dialog-title">${h(t('dbTitle'))}</h2><p>${h(t('dbDescription'))}</p><textarea id="db-json" aria-label="${h(t('dbTitle'))}" spellcheck="false"></textarea><div id="db-error" class="form-error" role="status"></div><div class="dialog-actions">${btn(t('dbExport'),'db-export')}${btn(t('dbReset'),'db-reset')}${btn(t('cancel'),'close')}${btn(t('dbApply'),'db-apply','','primary')}</div>`);document.getElementById('db-json').value=JSON.stringify(DB,null,2);}
function applyDB(value){try{validateDB(value,state);if(state){const trial=Core.clone(state);Core.ensureWorld(value,trial);validateSave({schema:value.meta.schema,db:value,state:trial});state=trial;}DB=value;try{localStorage.setItem(DEFAULT_DB.meta.dbStorageKey,JSON.stringify(DB));}catch{storageHealthy=false;}if(state)persist();else draft=null;closeModal();render();toast(t('dbApplied'));}catch(error){document.getElementById('db-error').textContent=t('dbInvalid',{error:error.message});}}
document.addEventListener('input',event=>{if(event.target.closest('#profile-form'))updateDraft(event);if(event.target.id==='world-search'){worldQuery=event.target.value;const caret=event.target.selectionStart;render();const input=document.getElementById('world-search');input.focus();input.setSelectionRange(caret,caret);}});
document.addEventListener('change',event=>{if(event.target.closest('#profile-form'))updateDraft(event);});
document.addEventListener('submit',event=>{if(event.target.id!=='profile-form')return;event.preventDefault();updateDraft();if(!event.target.reportValidity())return;const valid=Core.overall(DB,draft.stats)>=DB.rules.initialOverallMin&&Core.overall(DB,draft.stats)<=DB.rules.initialOverallMax;if(!valid)return;if(!draft.name.trim()){document.getElementById('profile-error').textContent=t('invalidProfile');return;}draft.name=draft.name.trim();creationStep='personality';renderOnboard();window.scrollTo({top:0});});
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;switch(action){
  case 'close':closeModal();break;
  case 'menu':document.getElementById('sidebar').classList.toggle('open');break;
  case 'profile-back':creationStep='profile';renderOnboard();window.scrollTo({top:0});break;
  case 'personality-select':draft.personality=button.dataset.id;renderPersonality();break;
  case 'personality-next':showContracts();break;
  case 'personality-back':closeModal();creationStep='personality';renderOnboard();break;
  case 'news-filter':newsScope=button.dataset.id;render();break;
  case 'npc-detail':npcDetails(button.dataset.id);break;
  case 'sign':state=Core.createCareer(DB,draft,button.dataset.route,button.dataset.club);screen='dashboard';reportId=null;closeModal();persist();render();window.scrollTo({top:0});break;
  case 'tab':screen=button.dataset.tab;reportId=null;render();window.scrollTo({top:0});break;
  case 'training':state.training=button.dataset.id;persist();render();break;
  case 'advance':{button.disabled=true;const record=Core.advance(DB,state);persist();screen='fixtures';reportId=record?.id||null;render();window.scrollTo({top:0});break;}
  case 'next-season':if(Core.nextSeason(DB,state)){reportId=null;screen='dashboard';persist();render();toast(t('startNewSeason'));}else{screen='career';render();toast(t('contractExpired'));}break;
  case 'report':reportId=button.dataset.id;screen='fixtures';render();window.scrollTo({top:0});break;
  case 'report-close':reportId=null;render();window.scrollTo({top:0});break;
  case 'world-scope':worldScope=button.dataset.scope;render();break;
  case 'fixture-scope':fixtureScope=button.dataset.scope;render();break;
  case 'stats-scope':statsScope=button.dataset.scope;render();break;
  case 'save':persist(true);break;
  case 'export':if(state){download(envelope(),DB.rules.exportFilename);toast(t('exportDone'));}break;
  case 'import':document.getElementById('save-input').click();break;
  case 'new':if(confirm(t('newConfirm'))){try{localStorage.removeItem(DEFAULT_DB.meta.storageKey);}catch{}state=null;draft=null;creationStep='profile';screen='dashboard';reportId=null;render();}break;
  case 'db':dbEditor();break;
  case 'db-export':download(DB,DB.rules.dbFilename);break;
  case 'db-reset':if(confirm(t('dbResetConfirm')))applyDB(Core.clone(DEFAULT_DB));break;
  case 'db-apply':try{applyDB(JSON.parse(document.getElementById('db-json').value));}catch(error){document.getElementById('db-error').textContent=t('dbInvalid',{error:error.message});}break;
  case 'transfer':case 'callup':if(Core.transfer(DB,state,button.dataset.club,action==='callup'?'callup':'transfer')){persist();screen='dashboard';reportId=null;render();toast(t('transferred',{club:currentClub().name}));}else toast(t('offerExpired'));break;
  case 'renew':if(Core.renew(DB,state)){persist();render();toast(t('contractRenewed'));}break;
}});
document.getElementById('save-input').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>DB.meta.maxSaveBytes)throw Error(t('saveSize'));const imported=Core.upgradeSave(DEFAULT_DB,JSON.parse(await file.text()));validateSave(imported);DB=imported.db;state=imported.state;screen='dashboard';reportId=null;draft=null;creationStep='profile';closeModal();persist();render();toast(t('importDone'));}catch(error){toast(`${t('invalidSave')} ${error.message}`);}finally{event.target.value='';}});
document.addEventListener('keydown',event=>{const modal=document.querySelector('.dialog');if(!modal)return;if(event.key==='Escape'){closeModal();return;}if(event.key==='Tab'){const focusable=[...modal.querySelectorAll('button:not([disabled]),textarea,input,select,a[href]')],first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
let creationStep='profile',newsScope='all';
const creationSteps=active=>`<div class="steps">${DB.creationSteps.map(step=>`<span class="${step.id===active?'creation-active':''}" ${step.id===active?'aria-current="step"':''}>${h(step.name)}</span>`).join('')}</div>`;
const clubTier=c=>DB.clubTiers.find(x=>x.id===c.prestigeTier)?.name||t('undecided');
const wishName=(kind,id)=>{if(id===DB.profile.unspecifiedId)return t('undecided');return (kind==='club'?idx().clubs[id]:idx().leagues[id])?.name||t('undecided');};
function positionOptions(fieldId){return DB.positions.map(p=>`<option value="${h(p.id)}" ${draft[fieldId]===p.id?'selected':''} ${DB.profile.positionFields.some(key=>key!==fieldId&&draft[key]===p.id)?'disabled':''}>${h(p.id+' · '+p.name)}</option>`).join('');}
function profileField(field){const value=draft[field.id],lim=DB.profile.limits;let input;if(field.type==='text')input=`<input id="profile-${h(field.id)}" name="${h(field.id)}" value="${h(value)}" maxlength="${lim.nameMax}" required autocomplete="name">`;else if(field.type==='number')input=`<input id="profile-${h(field.id)}" name="${h(field.id)}" type="number" value="${h(value)}" min="${lim[field.min]}" max="${lim[field.max]}" step="1" required>`;else{const tables={country:DB.countries,foot:DB.profile.feet,league:DB.profile.preferredLeagues,club:DB.profile.dreamClubs,characterTrait:DB.characterTraits};input=`<select id="profile-${h(field.id)}" name="${h(field.id)}" required>${field.type==='position'?positionOptions(field.id):options(tables[field.type],value)}</select>`;}return `<label for="profile-${h(field.id)}">${h(field.label)}${input}</label>`;}
function renderOnboard(){draft||=defaultDraft();if(creationStep==='personality'){renderPersonality();return;}renderProfile();}
function renderProfile(){
 document.getElementById('app').innerHTML=`<main class="onboard"><header class="onboard-header row between wrap"><div class="logo"><span class="logo-mark">XI</span><div>${h(DB.meta.title)}<small>${h(DB.meta.subtitle)}</small></div></div><div class="row wrap">${btn(t('import'),'import','','subtle')}${btn(t('dbEdit'),'db','','subtle')}${badge('v'+DB.meta.version)}</div></header><div class="onboard-main"><aside class="intro"><div class="eyebrow">${h(t('newCareer'))}</div><h1>${h(t('introTitle')).replace(/\n/g,'<br>')}</h1><p class="muted">${h(t('introDescription'))}</p><div class="profile-preview"><div id="preview-shirt">${shirt(draft.number)}</div><div id="preview-name" class="player-name">${h(draft.name)}</div><div id="preview-meta" class="player-meta"></div></div><p class="small muted" style="margin-top:22px">${h(t('storageNotice'))}</p></aside><section class="card">${creationSteps('profile')}<h2>${h(t('create'))}</h2><div class="divider"></div><form id="profile-form"><div class="form-grid">${DB.profile.fields.map(profileField).join('')}</div><div class="notice small" style="margin-top:18px"><b>${h(t('characterTraitHint'))}</b><p id="character-trait-hint" style="margin-top:8px"></p></div><div class="divider"></div><div class="section-head"><h3>${h(t('initialStats'))}</h3><span class="tag">${h(t('overall'))} <output id="initial-overall"></output> / ${DB.rules.initialOverallMax}</span></div><div class="stat-sliders">${DB.attributes.map(a=>`<label for="stat-${h(a.id)}"><span class="row between"><span>${h(a.name)} <span class="small muted">${h(a.short)}</span></span><output id="value-${h(a.id)}">${draft.stats[a.id]}</output></span><input id="stat-${h(a.id)}" name="stat-${h(a.id)}" type="range" min="${DB.profile.limits.statMin}" max="${DB.profile.limits.statMax}" step="${DB.profile.limits.statStep}" value="${draft.stats[a.id]}"></label>`).join('')}</div><div class="budget"><div class="row between"><b>${h(t('remainingAbility'))}</b><strong class="metric num"><output id="ability-remaining"></output></strong></div><p class="small muted">${h(t('initialStatsHint',{max:DB.rules.initialOverallMax,totalMax:DB.rules.initialOverallMax*DB.attributes.length}))}</p></div>${traitSliders()}<div id="profile-error" class="form-error" role="status"></div><button type="submit" id="begin-career" class="primary" style="width:100%">${h(t('begin'))} →</button></form></section></div><p class="small muted" style="margin-top:30px">${h(DB.meta.sampleNotice)}</p></main>`;updateDraft();
}
function updateDraft(event=null){const form=document.getElementById('profile-form');if(!form)return;const values=new FormData(form);for(const field of DB.profile.fields)draft[field.id]=field.type==='number'?Number(values.get(field.id)):String(values.get(field.id)||'');for(const a of DB.attributes)draft.stats[a.id]=Number(values.get('stat-'+a.id));
 const budget=DB.rules.initialOverallMax*DB.attributes.length,total=Core.sum(Object.values(draft.stats)),changed=DB.attributes.find(a=>'stat-'+a.id===event?.target?.id);
 if(changed&&total>budget)draft.stats[changed.id]=Core.clamp(draft.stats[changed.id]-(total-budget),DB.profile.limits.statMin,DB.profile.limits.statMax);
 const remaining=budget-Core.sum(Object.values(draft.stats));for(const a of DB.attributes){const slider=document.getElementById('stat-'+a.id);slider.max=Math.min(DB.profile.limits.statMax,draft.stats[a.id]+Math.max(0,remaining));slider.value=draft.stats[a.id];document.getElementById('value-'+a.id).textContent=n(draft.stats[a.id]);}
 for(const a of DB.traits){draft.traits[a.id]=Number(values.get('trait-'+a.id));document.getElementById('trait-value-'+a.id).textContent=n(draft.traits[a.id]);}
 for(const field of DB.profile.positionFields)document.getElementById('profile-'+field).innerHTML=positionOptions(field);
 const unique=new Set(DB.profile.positionFields.map(key=>draft[key])).size===DB.profile.positionFields.length,valid=unique&&remaining>=0;
 document.getElementById('initial-overall').textContent=n(Core.overall(DB,draft.stats),1);document.getElementById('ability-remaining').textContent=n(Math.max(0,remaining));document.getElementById('begin-career').disabled=!valid;document.getElementById('profile-error').textContent=!unique?t('positionUnique'):valid?'':t('invalidStats',{max:DB.rules.initialOverallMax});
 document.getElementById('character-trait-hint').textContent=DB.characterTraits.find(x=>x.id===draft.characterTrait).description;document.getElementById('preview-name').textContent=draft.name;document.getElementById('preview-meta').textContent=draft.position+' · '+(DB.countries.find(c=>c.id===draft.country)?.name||'');document.getElementById('preview-shirt').innerHTML=shirt(draft.number);
}
function renderPersonality(){document.getElementById('app').innerHTML=`<main class="onboard"><header class="onboard-header row between wrap"><div class="logo"><span class="logo-mark">XI</span><div>${h(DB.meta.title)}<small>${h(DB.meta.subtitle)}</small></div></div>${badge(draft.name+' · '+draft.position)}</header>${creationSteps('personality')}<div class="welcome"><h1>${h(t('personalityTitle'))}</h1><p>${h(t('personalityIntro'))}</p></div><div class="personality-grid" role="group" aria-label="${h(t('personality'))}">${DB.personalities.map(p=>`<button type="button" class="personality-card ${p.id===draft.personality?'selected':''}" data-action="personality-select" data-id="${h(p.id)}" aria-pressed="${p.id===draft.personality}"><div class="row between"><h2>${h(p.name)}</h2>${p.id===draft.personality?badge(t('personalitySelected'),'green'):''}</div><p class="personality-summary">${h(p.summary)}</p><h3>${h(t('personalityBenefits'))}</h3><ul>${p.strengths.map(x=>`<li>${h(x)}</li>`).join('')}</ul><h3>${h(t('personalityCosts'))}</h3><ul>${p.costs.map(x=>`<li>${h(x)}</li>`).join('')}</ul><div class="notice small"><b>${h(t('personalitySituations'))}</b><p>${h(p.situations)}</p></div></button>`).join('')}</div><div class="creation-actions">${btn(t('profileBack'),'profile-back')}${btn(t('personalityNext'),'personality-next','','primary')}</div></main>`;}
function newsCard(item,compact=false){return `<article class="card news-card"><div class="row between wrap"><div class="row wrap">${badge(t(item.status==='interest'?'interestNews':'confirmedNews'),item.status==='interest'?'pink':'green')}${item.club?badge(idx().clubs[item.club]?.name||''):''}</div><time class="small muted">${h(item.date)}</time></div><h2>${h(item.headline)}</h2><p>${h(item.body)}</p>${compact?`<p class="small muted">${h(item.sns)}</p>`:`<div class="news-reactions"><section><h3>${h(t('socialFans'))}</h3><p>${h(item.fans)}</p></section><section><h3>${h(t('socialPress'))}</h3><p>${h(item.press)}</p></section><section><h3>${h(t('socialSNS'))}</h3><p>${h(item.sns)}</p><div class="row small muted">${h(t('socialLikes'))} ${n(item.likes)} · ${h(t('socialComments'))} ${n(item.comments)}</div></section></div>${item.impact.morale||item.impact.reputation?`<p class="small muted">${h(t('socialImpact'))}: ${h(t('morale'))} ${n(item.impact.morale,2)} · ${h(t('reputation'))} ${n(item.impact.reputation,2)}</p>`:''}`}</article>`;}
function news(){const feed=state.world.news.filter(item=>newsScope==='all'||newsScope==='mine'&&(item.relatedPlayer||item.club===state.player.club)||item.category===newsScope).slice().reverse();return `<div class="welcome"><h1>${h(t('socialTitle'))}</h1><p>${h(t('socialHint'))}</p></div><div class="tabs-inline">${DB.newsFilters.map(filter=>btn(filter.name,'news-filter',`data-id="${h(filter.id)}"`,newsScope===filter.id?'selected':'')).join('')}</div>${feed.length?`<div class="stack">${feed.slice(0,DB.social.visibleCount).map(item=>newsCard(item)).join('')}</div>`:`<section class="card empty">${h(t('socialEmpty'))}</section>`}`;}
function recentNews(){const feed=state.world.news.filter(item=>item.relatedPlayer||item.club===state.player.club).slice(-DB.social.recentCount).reverse();return `<section class="card" style="margin-top:20px"><div class="section-head"><h2>${h(t('socialRecent'))}</h2>${btn(t('socialAll'),'tab','data-tab="news"','subtle')}</div>${feed.length?`<div class="stack">${feed.map(item=>newsCard(item,true)).join('')}</div>`:`<p class="small muted">${h(t('socialEmpty'))}</p>`}</section>`;}
function npcDetails(id){const p=Object.values(state.world.rosters).flat().find(x=>x.id===id);if(!p)return;const c=idx().clubs[p.club],personality=DB.personalities.find(x=>x.id===p.personality),style=DB.identityStyles.find(x=>x.id===p.identityStyle);openModal(`<h2 id="dialog-title">${h(p.name)}</h2><p>${h(c.name)} · ${h(p.position)} · ${n(p.age)}${h(t('ageUnit'))}</p><div class="cols equal" style="margin-top:20px"><section class="card"><h3>${h(t('playerIdentity'))}</h3><div class="detail-list">${detail(t('nationality'),DB.countries.find(x=>x.id===p.country)?.name||DB.leagues.find(x=>x.country===p.country)?.name||p.country)}${detail(t('height'),n(p.height)+' cm')}${detail(t('weight'),n(p.weight)+' kg')}${detail(t('foot'),DB.profile.feet.find(x=>x.id===p.foot).name)}${detail(t('identityStyle'),style?.name||'')}${detail(t('personality'),personality.name)}${detail(t('characterTrait'),DB.characterTraits.find(x=>x.id===p.characterTrait).name)}${detail(t('npcMinutes'),n(p.seasonMinutes))}${detail(t('npcCap'),n(p.traits.potential))}</div></section><section class="card"><h3>${h(t('dna'))}</h3><div class="detail-list">${DB.attributes.map(a=>detail(a.name,n(p.stats[a.id],1))).join('')}${DB.traits.map(a=>detail(a.name,n(p.traits[a.id],1))).join('')}</div></section></div><div class="dialog-actions">${btn(t('close'),'close')}</div>`);}

let worldScope=DB.worldViews[0].id,worldQuery='';
function traitSliders(){return `<div class="divider"></div><h3>${h(t('traitTitle'))}</h3><p class="small muted" style="margin:8px 0 18px">${h(t('traitHint'))}</p><div class="stat-sliders dna-sliders">${DB.traits.map(a=>`<label for="trait-${h(a.id)}"><span class="row between"><span>${h(a.name)}</span><output id="trait-value-${h(a.id)}">${n(draft.traits[a.id])}</output></span><input id="trait-${h(a.id)}" name="trait-${h(a.id)}" type="range" min="${a.min}" max="${a.max}" step="${a.step}" value="${draft.traits[a.id]}"><span class="small muted">${h(a.description)}</span></label>`).join('')}</div>`;}
function tacticsCard(){const p=state.player,club=currentClub(),manager=state.world.clubs[p.club].manager,tactic=Core.managerTactic(DB,state,p.club),role=Core.roleAssignment(DB,p,p.club,state);return `<section class="card"><div class="section-head"><h2>${h(t('tacticalFit'))}</h2>${badge(tactic.name)}</div><div class="detail-list">${detail(t('manager'),manager.name)}${detail(t('roleRank'),[p.position,p.secondaryPosition,p.tertiaryPosition].join(' / '))}${detail(t('actualRole'),role.position)}${detail(t('roleFit'),n(role.fit*DB.rules.scale,1)+'%')}${detail(t('coaching'),n(manager.coaching,1))}${detail(t('adaptation'),n(p.adaptation,1))}</div><p class="small muted" style="margin-top:16px">${h(t('managerHint'))}</p></section>`;}
function growthSummary(){const p=state.player,dev=p.development;return `<section class="card"><div class="section-head"><h2>${h(t('developmentTitle'))}</h2>${badge(t(dev.phase),dev.phase==='growthBurst'?'green':'')}</div><div class="kpi-grid">${kpi(t('overall'),n(Core.overall(DB,p.stats),1))}${kpi(t('attainableCeiling'),n(Core.mean(Object.values(dev.caps)),1))}${kpi(t('birthCeiling'),n(Core.mean(Object.values(dev.birth)),1))}${kpi(t('starPower'),n(Core.starPower(DB,p),1))}</div><p class="small muted" style="margin-top:16px">${h(t('developmentHint'))}</p></section>`;}
function dashboard(){return baseDashboard()+recentNews()+`<div class="cols equal" style="margin-top:20px">${tacticsCard()}${growthSummary()}</div>`;}
function team(){return `<div class="cols equal" style="margin-bottom:20px">${tacticsCard()}<section class="card"><h2>${h(t('environment'))}</h2><div class="detail-list">${detail(t('clubPrestige'),clubTier(currentClub()))}${detail(t('prestigeValue'),n(currentClub().prestige,1))}${detail(t('finance'),money(state.world.clubs[state.player.club].finance))}${detail(t('environment'),n(state.world.clubs[state.player.club].environment,1))}${detail(t('trend'),DB.dynamics.trends.find(x=>x.id===state.world.trend).name)}</div><p class="small muted" style="margin-top:15px">${h(t('clubStandingHint'))}</p>${currentClub().scenarioNote?`<p class="notice small" style="margin-top:12px">${h(currentClub().scenarioNote)}</p>`:''}</section></div>`+baseTeam();}
function career(){return `<div style="margin-bottom:20px">${growthSummary()}</div>`+baseCareer();}
function report(record){const c=record.result.context,reactions=record.reactions;return baseReport(record)+`<div class="cols equal" style="margin-top:20px"><section class="card"><h2>${h(t('fans'))}</h2><p class="reaction">${h(reactions?.fans||t('legacyReport'))}</p><div class="divider"></div><h2>${h(t('press'))}</h2><p class="reaction">${h(reactions?.press||t('legacyReport'))}</p></section><section class="card"><div class="section-head"><h2>${h(t('contextTitle'))}</h2>${c?badge(c.position):''}</div>${c?`<div class="detail-list">${detail(t('manager'),c.manager.name)}${detail(t('roleFit'),n(c.roleFit*DB.rules.scale,1)+'%')}${detail(t('fitness'),n(c.fitness,1))}${detail(t('adaptation'),n(c.adaptation,1))}</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>${h(t('initialStats'))}</th><th>${h(t('quality'))}</th><th>${h(t('factorPsychology'))}</th><th>${h(t('factorFatigue'))}</th><th>${h(t('factorPressure'))}</th></tr></thead><tbody>${DB.attributes.map(a=>{const f=c.actions[a.id];return `<tr><td>${h(a.name)}</td><td class="num">${n(f.skill,1)}</td><td class="num">×${n(f.psychology,2)}</td><td class="num">×${n(f.fatigue,2)}</td><td class="num">×${n(f.pressure,2)}</td></tr>`;}).join('')}</tbody></table></div><p class="small muted" style="margin-top:14px">${h(t('contextHint'))}</p>`:`<p class="small muted">${h(t('legacyReport'))}</p>`}</section></div>`;}
function development(){const p=state.player,dev=p.development,personality=DB.personalities.find(x=>x.id===p.personality),type=DB.growthTypes.find(x=>x.id===p.growthType);return `<div class="welcome"><h1>${h(t('developmentTitle'))}</h1><p>${h(t('developmentHint'))}</p></div>${growthSummary()}<div class="cols equal" style="margin-top:20px"><div class="stack"><section class="card"><div class="section-head"><h2>${h(t('dna'))}</h2>${badge(personality.name)}</div><p class="notice small">${h(personality.description)}</p><p class="small muted" style="margin:15px 0">${h(t('characterTrait'))}: ${h(DB.characterTraits.find(x=>x.id===p.characterTrait).name)}<br>${h(t('growthType'))}: ${h(type.name)} · ${h(type.description)}</p><div class="detail-list">${DB.traits.map(a=>`<div><div class="row between"><span>${h(a.name)}</span><b class="num">${n(p.traits[a.id],1)}</b></div>${progress(p.traits[a.id])}<p class="small muted">${h(a.description)}</p></div>`).join('')}</div></section>${tacticsCard()}</div><div class="stack"><section class="card"><h2>${h(t('attainableCeiling'))}</h2><div class="table-wrap"><table><thead><tr>${['initialStats','overall','attainableCeiling','birthCeiling'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${DB.attributes.map(a=>`<tr><td>${h(a.name)}</td><td class="num">${n(p.stats[a.id],1)}</td><td class="num">${n(dev.caps[a.id],1)}</td><td class="num">${n(dev.birth[a.id],1)}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:14px">${h(t('capNote'))}</p><div class="divider"></div><div class="detail-list">${Object.entries(dev.factors).map(([key,value])=>detail(t(key),n(value,1))).join('')}${detail(t('style'),DB.dynamics.styles.find(x=>x.id===dev.style).name)}${detail(t('careerMileage'),n(dev.experience,1)+t('minutesShort'))}</div></section><section class="card"><h2>${h(t('growthHistory'))}</h2>${dev.records.length?`<div class="table-wrap"><table><thead><tr>${['date','phase','overall','attainableCeiling','ceilingDelta','growthRate'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${dev.records.slice().reverse().map(x=>`<tr><td>${h(x.date)}</td><td>${h(t(x.phase))}</td><td>${n(x.overall,2)}</td><td>${n(x.cap,2)}</td><td>${x.capDelta>0?'+':''}${n(x.capDelta,2)}</td><td>×${n(x.speed,2)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="small muted">${h(t('noDevelopment'))}</p>`}</section><section class="card"><h2>${h(t('injuryHistory'))}</h2>${dev.injuries.length?dev.injuries.slice().reverse().map(x=>`<div class="history-item"><span>${h(x.date)}</span><b>${h(DB.dynamics.injuries.find(i=>i.id===x.injury).name)}</b><span>${n(x.weeks)} · −${n(x.loss,1)}</span></div>`).join(''):`<p class="small muted">${h(t('noStats'))}</p>`}</section></div></div>`;}
function world(){const w=state.world,i=idx(),players=Object.entries(w.rosters).flatMap(([club,list])=>list.map(p=>({...p,club}))),sorted=players.filter(p=>p.age<=DB.dynamics.worldProspectAge).sort((a,b)=>b.traits.potential-a.traits.potential),stars=players.slice().sort((a,b)=>Core.overall(DB,b.stats)-Core.overall(DB,a.stats)),leaders=worldScope==='prospects'?sorted:worldScope==='retired'?w.retired.slice().reverse():stars;return `<div class="welcome"><h1>${h(t('worldTitle'))}</h1><p>${h(t('worldHint'))}</p></div><div class="kpi-grid" style="margin-bottom:20px">${kpi(t('trend'),DB.dynamics.trends.find(x=>x.id===w.trend).name)}${kpi(t('player'),n(players.length),t('worldSeason',{n:state.season,players:players.length,retired:w.retired.length}))}${kpi(t('club'),n(Object.keys(w.clubs).length))}${kpi(t('retired'),n(w.retired.length))}</div><div class="cols"><div class="stack"><section class="card"><div class="section-head"><h2>${h(t('prospects'))}</h2>${badge(t('databaseLabel'))}</div><div class="tabs-inline">${DB.worldViews.map(v=>btn(v.name,'world-scope',`data-scope="${h(v.id)}"`,worldScope===v.id?'selected':'')).join('')}</div><label>${h(t('worldSearch'))}<input id="world-search" value="${h(worldQuery)}" placeholder="${h(t('worldSearchHint'))}"></label><div class="table-wrap" style="margin-top:16px"><table><thead><tr>${['player','club','age','position','identityStyle','overall','npcCap','npcMinutes','playerDetails'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${leaders.filter(p=>!worldQuery||(p.name+' '+i.clubs[p.club].name+' '+(p.position||'')).toLowerCase().includes(worldQuery.toLowerCase())).slice(0,DB.dynamics.worldTableLimit).map(p=>`<tr><td>${h(p.name)}</td><td>${h(i.clubs[p.club].name)}</td><td>${n(p.age)}</td><td>${h(p.position||t('retired'))}</td><td>${h(DB.identityStyles.find(x=>x.id===p.identityStyle)?.name||'—')}</td><td>${p.stats?n(Core.overall(DB,p.stats),1):'—'}</td><td>${p.traits?n(p.traits.potential,1):'—'}</td><td>${n(p.seasonMinutes??p.minutes)}</td><td>${p.stats?btn(t('playerDetails'),'npc-detail',`data-id="${h(p.id)}"`,'subtle small'):'—'}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>${h(t('worldClubs'))}</h2><div class="table-wrap"><table><thead><tr>${['club','competition','clubPrestige','quality','manager','tacticalFit','finance','environment'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${Object.values(i.clubs).map(c=>`<tr class="${c.id===state.player.club?'highlight':''}"><td>${h(c.name)}</td><td>${h(i.leagues[c.league].name)}</td><td>${h(clubTier(c))}</td><td>${n(c.quality,1)}</td><td>${h(c.manager.name)}</td><td>${h(Core.managerTactic(DB,state,c.id).name)}</td><td>${money(c.finance)}</td><td>${n(c.environment,1)}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>${h(t('seasonSnapshot'))}</h2>${w.snapshots.length?w.snapshots.slice().reverse().map(x=>`<div class="history-item"><b>${h(t('season',{n:x.season}))}</b><span>${h(DB.dynamics.trends.find(t=>t.id===x.trend).name)}</span><span>${h(x.leaders[0]?.name||'')} · ${n(x.leaders[0]?.goals||0)} ${h(t('goal'))}</span></div>`).join(''):`<p class="small muted">${h(t('noStats'))}</p>`}</section></div><section class="card"><div class="section-head"><h2>${h(t('worldEvents'))}</h2>${badge(w.events.length)}</div><div class="events">${w.events.slice(-DB.dynamics.worldVisibleEvents).reverse().map(e=>`<div class="event"><time>${h(e.date)}</time><div><b>${h(e.text)}</b><p>${h(t('season',{n:e.season}))}</p></div></div>`).join('')}</div><p class="notice small" style="margin-top:18px">${h(t('deferred'))}</p></section></div>`;}

try{const custom=localStorage.getItem(DEFAULT_DB.meta.dbStorageKey);if(custom){const parsed=Core.upgradeDatabase(DEFAULT_DB,JSON.parse(custom));if(parsed.meta.schema===DEFAULT_DB.meta.schema){validateDB(parsed);DB=parsed;}}const saved=localStorage.getItem(DEFAULT_DB.meta.storageKey);if(saved){const parsed=Core.upgradeSave(DEFAULT_DB,JSON.parse(saved));validateSave(parsed);DB=parsed.db;state=parsed.state;}}catch{storageHealthy=false;toast(t('loadError'));}
render();
</script>
</body>
</html>
