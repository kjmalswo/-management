/* ENGINE: Pure rules over the database. Numeric 0/1 and PRNG/hash constants are

'use strict';
const FootballCore = (() => {
  const clone = value => JSON.parse(JSON.stringify(value));
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const sum = list => list.reduce((total, value) => total + value, 0);
  const mean = list => list.length ? sum(list) / list.length : 0;
  const hash = value => { let h = 2166136261; for (const c of String(value)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const random = seed => { let a = seed >>> 0; return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  const range = (rng, min, max) => min + rng() * (max - min);
  const integer = (rng, min, max) => Math.floor(range(rng, min, max + 1));
  const pick = (rng, list) => list[Math.floor(rng() * list.length)];
  const weighted = (rng, list, weight) => { const total = sum(list.map(weight)); if (!total) return pick(rng,list); let target = rng() * total; return list.find(item => (target -= weight(item)) < 0) || list.at(-1); };
  const dateAdd = (date, days) => { const d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().split('T')[0]; };
  const indexCache=new WeakMap();
  const indexes = (db,state=null) => {const key=state?.world||db;let result=indexCache.get(key);if(!result){result={clubs:Object.fromEntries(db.clubs.map(x=>[x.id,{...x,...state?.world?.clubs?.[x.id]}])),leagues:Object.fromEntries(db.leagues.map(x=>[x.id,x])),positions:Object.fromEntries(db.positions.map(x=>[x.id,x]))};indexCache.set(key,result);}return result;};
  const overall = (db, stats) => mean(db.attributes.map(a => stats[a.id]));
  const suitability = (db, player) => { const pos = db.positions.find(x=>x.id===player.position); return sum(db.attributes.map(a=>player.stats[a.id]*(pos.weights[a.id]||0))); };
  const createStats = db => Object.fromEntries(db.ui.statFields.filter(f=>!f.derived).map(f=>[f.id,0]));
  const metric = (db, stats, key) => key === 'passAccuracy' ? (stats.passes ? stats.completed / stats.passes * db.rules.scale : 0) : (stats[key] || 0);
  function generateRoster(db, clubId) {
    const idx = indexes(db), club = idx.clubs[clubId], league = idx.leagues[club.league], e=db.engine;
    const rng=random(hash(`${db.meta.seed}:${club.id}:roster`));
    const country=clubCountry(db,club),firstNames=db.names.firstNamesByCountry[country]||e.firstNames,lastNames=e.lastNames[country]||e.lastNames.default,order=db.names.nameOrders[country]||db.names.nameOrders.default;
    const availableNames=firstNames.flatMap(first=>lastNames.map(last=>(order.familyFirst?[last,first]:[first,last]).join(order.separator)));
    return [...e.formation,...e.bench].slice(0,db.rules.squadSize).map((position, i)=>{
      const pos=idx.positions[position], quality=club.quality+range(rng,-e.rosterSpread,e.rosterSpread)-(i>=e.formation.length?e.benchQualityDrop:0);
      const stats=Object.fromEntries(db.attributes.map(a=>[a.id,clamp(quality+range(rng,-e.attributeSpread,e.attributeSpread)+(pos.weights[a.id]-e.roleBaselineWeight)*e.roleBoost,db.rules.abilityMin,db.rules.abilityMax)]));
      if(pos.group==='keeper')stats.shooting=Math.min(stats.shooting,e.goalkeeperShotCap);
      const name=availableNames.splice(Math.floor(rng()*availableNames.length),1)[0];
      return {id:`${club.id}:${i}`,name,position,stats,foot:pick(rng,db.profile.feet).id,height:pos.preferredHeight,weight:pos.preferredWeight};
    });
  }

  function competition(db, player, clubId,state=null) {
    const role=roleAssignment(db,player,clubId,state),team=roster(db,clubId,state);
    return Math.max(...team.map(p=>suitability(db,{...p,position:role.position})*roleFit(db,p,role.position)));
  }

  function selection(db,state) {
    const p=state.player,r=db.rules,e=db.engine.selection,d=db.dynamics;
    if(p.freeAgent||p.injury>0||p.suspension>0||p.fitness<r.minimumFitnessForSelection)return 0;
    const recent=p.history.filter(x=>x.stats.minutes>0).slice(-r.recentFormMatches),form=recent.length?mean(recent.map(x=>x.stats.rating)):e.formCenter;

  function createCareer(db,profile,routeId,clubId) {
    const route=db.routes.find(x=>x.id===routeId),r=db.rules;

    const state={schema:db.meta.schema,seed:hash(`${db.meta.seed}:${p.name}:${p.country}:${p.position}`),season:1,round:0,date:db.meta.initialDate,seasonStart:db.meta.initialDate,player:p,training:db.training[0].id,fixtures:{},offers:[],archives:[]};
    p.displayName=String(p.displayName||p.name).trim()||p.name;initializePlayer(db,p,state);ensureWorld(db,state);state.fixtures=worldFixtures(db,1,state.date,state);initializeSystems(db,state);return state;

{draft.stats[a.id]}"></label>`).join('')}</div><div class="budget"><div class="row between"><b>${h(t('remainingAbility'))}</b><strong class="metric num"><output id="ability-remaining"></output></strong></div><p class="small muted">${h(t('initialStatsHint',{max:DB.rules.initialOverallMax,totalMax:DB.rules.initialOverallMax*DB.attributes.length}))} ${h(t('remainingAbilityHint'))}</p></div>${traitSliders()}<div id="profile-error" class="form-error" role="status"></div><button type="submit" id="begin-career" class="primary" style="width:100%">${h(t('begin'))} →</button></form></section></div><p class="small muted" style="margin-top:30px">${h(DB.meta.sampleNotice)}</p></main>`;updateDraft();
}
function updateDraft(event=null){const form=document.getElementById('profile-form');if(!form)return;const previous=Object.fromEntries(DB.profile.positionFields.map(key=>[key,draft[key]])),values=new FormData(form);for(const field of DB.profile.fields)draft[field.id]=field.type==='number'?Number(values.get(field.id)):String(values.get(field.id)||'');const positionField=DB.profile.positionFields.find(key=>'profile-'+key===event?.target?.id);if(positionField){const duplicate=DB.profile.positionFields.find(key=>key!==positionField&&draft[key]===draft[positionField]);if(duplicate)draft[duplicate]=previous[positionField];}const changed=DB.attributes.find(a=>'stat-'+a.id===event?.target?.id),budget=DB.rules.initialOverallMax*DB.attributes.length;if(changed){const others=Core.sum(DB.attributes.filter(a=>a.id!==changed.id).map(a=>draft.stats[a.id]));draft.stats[changed.id]=Core.clamp(Number(values.get('stat-'+changed.id)),DB.profile.limits.statMin,Math.min(DB.profile.limits.statMax,budget-others));}

 const remaining=budget-Core.sum(Object.values(draft.stats));for(const a of DB.attributes){const slider=document.getElementById('stat-'+a.id);slider.max=DB.profile.limits.statMax;slider.value=draft.stats[a.id];document.getElementById('value-'+a.id).textContent=n(draft.stats[a.id]);}
 for(const a of DB.traits){draft.traits[a.id]=Number(values.get('trait-'+a.id));document.getElementById('trait-value-'+a.id).textContent=n(draft.traits[a.id]);}
 for(const field of DB.profile.positionFields)document.getElementById('profile-'+field).innerHTML=positionOptions(field);
 const unique=new Set(DB.profile.positionFields.map(key=>draft[key])).size===DB.profile.positionFields.length,valid=unique&&remaining>=0;
 document.getElementById('initial-overall').textContent=abilityLabel(Core.overall(DB,draft.stats));document.getElementById('ability-remaining').textContent=n(Math.max(0,remaining));document.getElementById('begin-career').disabled=!valid;document.getElementById('profile-error').textContent=!unique?t('positionUnique'):valid?'':t('invalidStats',{max:DB.rules.initialOverallMax});
 document.getElementById('character-trait-hint').textContent=DB.characterTraits.find(x=>x.id===draft.characterTrait).description;document.getElementById('preview-name').textContent=draft.name;document.getElementById('preview-meta').textContent=draft.position+' · '+(DB.countries.find(c=>c.id===draft.country)?.name||'');document.getElementById('preview-shirt').innerHTML=shirt(draft.number,draft.displayName||draft.name);
}
function renderPersonality(){document.getElementById('app').innerHTML=`<main class="onboard"><header class="onboard-header row between wrap"><div class="logo"><span class="logo-mark">XI</span><div>${h(DB.meta.title)}<small>${h(DB.meta.subtitle)}</small></div></div>${badge(draft.name+' · '+draft.position)}</header>${creationSteps('personality')}<div class="welcome"><h1>${h(t('personalityTitle'))}</h1><p>${h(t('personalityIntro'))}</p></div><div class="personality-grid" role="group" aria-label="${h(t('personality'))}">${DB.personalities.map(p=>`<button type="button" class="personality-card ${p.id===draft.personality?'selected':''}" data-action="personality-select" data-id="${h(p.id)}" aria-pressed="${p.id===draft.personality}"><div class="row between"><h2>${h(p.name)}</h2>${p.id===draft.personality?badge(t('personalitySelected'),'green'):''}</div><p class="personality-summary">${h(p.summary)}</p><h3>${h(t('personalityBenefits'))}</h3><ul>${p.strengths.map(x=>`<li>${h(x)}</li>`).join('')}</ul><h3>${h(t('personalityCosts'))}</h3><ul>${p.costs.map(x=>`<li>${h(x)}</li>`).join('')}</ul><div class="notice small"><b>${h(t('personalitySituations'))}</b><p>${h(p.situations)}</p></div></button>`).join('')}</div><div class="creation-actions">${btn(t('profileBack'),'profile-back')}${btn(t('personalityNext'),'personality-next','','primary')}</div></main>`;}
function newsCard(item,compact=false){return `<article class="card news-card"><div class="row between wrap"><div class="row wrap">${badge(t(item.status==='interest'?'interestNews':'confirmedNews'),item.status==='interest'?'pink':'green')}${item.club?badge(idx().clubs[item.club]?.name||''):''}</div><time class="small muted">${h(item.date)}</time></div><h2>${h(item.headline)}</h2><p>${h(item.body)}</p>${compact?`<p class="small muted">${h(item.sns)}</p>`:`<div class="news-reactions"><section><h3>${h(t('socialFans'))}</h3><p>${h(item.fans)}</p></section><section><h3>${h(t('socialPress'))}</h3><p>${h(item.press)}</p></section><section><h3>${h(t('socialSNS'))}</h3><p>${h(item.sns)}</p><div class="row small muted">${h(t('socialLikes'))} ${n(item.likes)} · ${h(t('socialComments'))} ${n(item.comments)}</div></section></div>${item.impact.morale||item.impact.reputation?`<p class="small muted">${h(t('socialImpact'))}: ${h(t('morale'))} ${n(item.impact.morale,2)} · ${h(t('reputation'))} ${n(item.impact.reputation,2)}</p>`:''}`}</article>`;}
function news(){const feed=state.world.news.filter(worldNewsRelevant).filter(item=>newsScope==='all'||newsScope==='mine'&&(item.relatedPlayer||item.club===state.player.club)||item.category===newsScope).slice().reverse();return `<div class="welcome"><h1>${h(t('socialTitle'))}</h1><p>${h(t('socialHint'))}</p></div><div class="tabs-inline">${DB.newsFilters.map(filter=>btn(filter.name,'news-filter',`data-id="${h(filter.id)}"`,newsScope===filter.id?'selected':'')).join('')}</div>${feed.length?`<div class="stack">${feed.slice(0,DB.social.visibleCount).map(item=>newsCard(item)).join('')}</div>`:`<section class="card empty">${h(t('socialEmpty'))}</section>`}`;}
function recentNews(){const feed=state.world.news.filter(worldNewsRelevant).filter(item=>item.relatedPlayer||item.club===state.player.club).slice(-DB.social.recentCount).reverse();return `<section class="card" style="margin-top:20px"><div class="section-head"><h2>${h(t('socialRecent'))}</h2>${btn(t('socialAll'),'tab','data-tab="news"','subtle')}</div>${feed.length?`<div class="stack">${feed.map(item=>newsCard(item,true)).join('')}</div>`:`<p class="small muted">${h(t('socialEmpty'))}</p>`}</section>`;}
function npcDetails(id){const p=Object.values(state.world.rosters).flat().find(x=>x.id===id);if(!p)return;const c=idx().clubs[p.club],personality=DB.personalities.find(x=>x.id===p.personality),style=DB.identityStyles.find(x=>x.id===p.identityStyle);openModal(`<h2 id="dialog-title">${h(p.name)}</h2><p>${h(c.name)} · ${h(p.position)} · ${n(p.age)}${h(t('ageUnit'))}</p><div class="cols equal" style="margin-top:20px"><section class="card"><h3>${h(t('playerIdentity'))}</h3><div class="detail-list">${detail(t('nationality'),DB.countries.find(x=>x.id===p.country)?.name||DB.leagues.find(x=>x.country===p.country)?.name||p.country)}${detail(t('height'),n(p.height)+' cm')}${detail(t('weight'),n(p.weight)+' kg')}${detail(t('foot'),DB.profile.feet.find(x=>x.id===p.foot).name)}${detail(t('identityStyle'),style?.name||'')}${detail(t('personality'),personality.name)}${detail(t('characterTrait'),DB.characterTraits.find(x=>x.id===p.characterTrait).name)}${detail(t('npcMinutes'),n(p.seasonMinutes))}${detail(t('npcCap'),n(p.traits.potential))}</div></section><section class="card"><h3>${h(t('dna'))}</h3><div class="detail-list">${DB.attributes.map(a=>detail(a.name,n(p.stats[a.id],1))).join('')}${DB.traits.map(a=>detail(a.name,n(p.traits[a.id],1))).join('')}</div></section></div><div class="dialog-actions">${btn(t('close'),'close')}</div>`);}

let worldScope=DB.worldViews[0].id,worldQuery='';
function traitSliders(){return `<div class="divider"></div><h3>${h(t('traitTitle'))}</h3><p class="small muted" style="margin:8px 0 18px">${h(t('traitHint'))}</p><div class="stat-sliders dna-sliders">${DB.traits.map(a=>`<label for="trait-${h(a.id)}"><span class="row between"><span>${h(a.name)}</span><output id="trait-value-${h(a.id)}">${n(draft.traits[a.id])}</output></span><input id="trait-${h(a.id)}" name="trait-${h(a.id)}" type="range" min="${a.min}" max="${a.max}" step="${a.step}" value="${draft.traits[a.id]}"><span class="small muted">${h(a.description)}</span></label>`).join('')}</div>`;}
function tacticsCard(){const p=state.player,club=currentClub(),manager=state.world.clubs[p.club].manager,tactic=Core.managerTactic(DB,state,p.club),role=Core.roleAssignment(DB,p,p.club,state);return `<section class="card"><div class="section-head"><h2>${h(t('tacticalFit'))}</h2>${badge(tactic.name)}</div><div class="detail-list">${detail(t('manager'),manager.name)}${detail(t('roleRank'),[p.position,p.secondaryPosition,p.tertiaryPosition].join(' / '))}${detail(t('actualRole'),role.position)}${detail(t('roleFit'),n(role.fit*DB.rules.scale,1)+'%')}${detail(t('coaching'),n(manager.coaching,1))}${detail(t('adaptation'),n(p.adaptation,1))}</div><p class="small muted" style="margin-top:16px">${h(t('managerHint'))}</p></section>`;}
function growthSummary(){const p=state.player,dev=p.development;return `<section class="card"><div class="section-head"><h2>${h(t('developmentTitle'))}</h2>${badge(t(dev.phase),dev.phase==='growthBurst'?'green':'')}</div><div class="kpi-grid">${kpi(t('overall'),abilityLabel(Core.overall(DB,p.stats)))}${kpi(t('attainableCeiling'),n(Core.mean(Object.values(dev.caps)),1))}${kpi(t('birthCeiling'),n(Core.mean(Object.values(dev.birth)),1))}${kpi(t('starPower'),n(Core.starPower(DB,p),1))}</div><p class="small muted" style="margin-top:16px">${h(t('developmentHint'))}</p></section>`;}
function dashboard(){return calendarSummary()+pendingArrival()+(state.player.freeAgent?`<div class="notice warning" style="margin-bottom:20px">${h(t('freeAgent'))}</div>`:'')+baseDashboard()+recentNews()+`<div class="cols equal" style="margin-top:20px">${tacticsCard()}${growthSummary()}</div>`;}
function team(){return `<div class="cols equal" style="margin-bottom:20px">${tacticsCard()}<section class="card"><h2>${h(t('environment'))}</h2><div class="detail-list">${detail(t('clubPrestige'),clubTier(currentClub()))}${detail(t('prestigeValue'),n(currentClub().prestige,1))}${detail(t('finance'),money(state.world.clubs[state.player.club].finance))}${detail(t('environment'),n(state.world.clubs[state.player.club].environment,1))}${detail(t('trend'),DB.dynamics.trends.find(x=>x.id===state.world.trend).name)}</div><p class="small muted" style="margin-top:15px">${h(t('clubStandingHint'))}</p>${currentClub().scenarioNote?`<p class="notice small" style="margin-top:12px">${h(currentClub().scenarioNote)}</p>`:''}</section></div>`+baseTeam();}

function development(){const p=state.player,dev=p.development,personality=DB.personalities.find(x=>x.id===p.personality),type=DB.growthTypes.find(x=>x.id===p.growthType);return `<div class="welcome"><h1>${h(t('developmentTitle'))}</h1><p>${h(t('developmentHint'))}</p></div>${growthSummary()}<div class="cols equal" style="margin-top:20px"><div class="stack"><section class="card"><div class="section-head"><h2>${h(t('dna'))}</h2>${badge(personality.name)}</div><p class="notice small">${h(personality.description)}</p><p class="small muted" style="margin:15px 0">${h(t('characterTrait'))}: ${h(DB.characterTraits.find(x=>x.id===p.characterTrait).name)}<br>${h(t('growthType'))}: ${h(type.name)} · ${h(type.description)}</p><div class="detail-list">${DB.traits.map(a=>`<div><div class="row between"><span>${h(a.name)}</span><b class="num">${n(p.traits[a.id],1)}</b></div>${progress(p.traits[a.id])}<p class="small muted">${h(a.description)}</p></div>`).join('')}</div></section>${tacticsCard()}</div><div class="stack"><section class="card"><h2>${h(t('attainableCeiling'))}</h2><div class="table-wrap"><table><thead><tr>${['initialStats','overall','attainableCeiling','birthCeiling'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${DB.attributes.map(a=>`<tr><td>${h(a.name)}</td><td class="num">${n(p.stats[a.id],1)}</td><td class="num">${n(dev.caps[a.id],1)}</td><td class="num">${n(dev.birth[a.id],1)}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:14px">${h(t('capNote'))}</p><div class="divider"></div><div class="detail-list">${Object.entries(dev.factors).map(([key,value])=>detail(t(key),n(value,1))).join('')}${detail(t('style'),DB.dynamics.styles.find(x=>x.id===dev.style).name)}${detail(t('careerMileage'),n(dev.experience,1)+t('minutesShort'))}</div></section><section class="card"><h2>${h(t('growthHistory'))}</h2>${dev.records.length?`<div class="table-wrap"><table><thead><tr>${['date','phase','overall','attainableCeiling','ceilingDelta function legacyWorld(){const w=state.world,i=idx(),players=Object.entries(w.rosters).flatMap(([club,list])=>list.map(p=>({...p,club}))),sorted=players.filter(p=>p.age<=DB.dynamics.worldProspectAge).sort((a,b)=>b.traits.potential-a.traits.potential),stars=players.slice().sort((a,b)=>Core.overall(DB,b.stats)-Core.overall(DB,a.stats)),leaders=worldScope==='prospects'?sorted:worldScope==='retired'?w.retired.slice().reverse():stars;return `<div class="welcome"><h1>${h(t('worldTitle'))}</h1><p>${h(t('worldHint'))}</p></div><div class="kpi-grid" style="margin-bottom:20px">${kpi(t('trend'),DB.dynamics.trends.find(x=>x.id===w.trend).name)}${kpi(t('player'),n(players.length),t('worldSeason',{n:state.season,players:players.length,retired:w.retired.length}))}${kpi(t('club'),n(Object.keys(w.clubs).length))}${kpi(t('retired'),n(w.retired.length))}</div><div class="cols"><div class="stack"><section class="card"><div class="section-head"><h2>${h(t('prospects'))}</h2>${badge(t('databaseLabel'))}</div><div class="tabs-inline">${DB.worldViews.map(v=>btn(v.name,'world-scope',`data-scope="${h(v.id)}"`,worldScope===v.id?'selected':'')).join('')}</div><label>${h(t('worldSearch'))}<input id="world-search" value="${h(worldQuery)}" placeholder="${h(t('worldSearchHint'))}"></label><div class="table-wrap" style="margin-top:16px"><table><thead><tr>${['player','club','age','position','identityStyle','overall','npcCap','npcMinutes','playerDetails'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${leaders.filter(p=>!worldQuery||(p.name+' '+i.clubs[p.club].name+' '+(p.position||'')).toLowerCase().includes(worldQuery.toLowerCase())).slice(0,DB.dynamics.worldTableLimit).map(p=>`<tr><td>${h(p.name)}</td><td>${h(i.clubs[p.club].name)}</td><td>${n(p.age)}</td><td>${h(p.position||t('retired'))}</td><td>${h(DB.identityStyles.find(x=>x.id===p.identityStyle)?.name||'—')}</td><td>${p.stats?abilityLabel(Core.overall(DB,p.stats)):'—'}</td><td>${p.traits?n(p.traits.potential,1):'—'}</td><td>${n(p.seasonMinutes??p.minutes)}</td><td>${p.stats?btn(t('playerDetails'),'npc-detail',`data-id="${h(p.id)}"`,'subtle small'):'—'}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>${h(t('worldClubs'))}</h2><div class="table-wrap"><table><thead><tr>${['club','competition','clubPrestige','quality','manager','tacticalFit','finance','environment'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${Object.values(i.clubs).map(c=>`<tr class="${c.id===state.player.club?'highlight':''}"><td>${h(c.name)}</td><td>${h(i.leagues[c.league].name)}</td><td>${h(clubTier(c))}</td><td>${n(c.quality,1)}</td><td>${h(c.manager.name)}</td><td>${h(Core.managerTactic(DB,state,c.id).name)}</td><td>${money(c.finance)}</td><td>${n(c.environment,1)}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>${h(t('seasonSnapshot'))}</h2>${w.snapshots.length?w.snapshots.slice().reverse().map(x=>`<div class="history-item"><b>${h(t('season',{n:x.season}))}</b><span>${h(DB.dynamics.trends.find(t=>t.id===x.trend).name)}</span><span>${h(x.leaders[0]?.name||'')} · ${n(x.leaders[0]?.goals||0)} ${h(t('goal'))}</span></div>`).join(''):`<p class="small muted">${h(t('noStats'))}</p>`}</section></div><section class="card"><div class="section-head"><h2>${h(t('worldEvents'))}</h2>${badge(w.events.length)}</div><div class="events">${w.events.slice(-DB.dynamics.worldVisibleEvents).reverse().map(e=>`<div class="event"><time>${h(e.date)}</time><div><b>${h(e.text)}</b><p>${h(t('season',{n:e.season}))}</p></div></div>`).join('')}</div><p class="notice small" style="margin-top:18px">${h(t('deferred'))}</p></section></div>`;}

function inbox(){const selected=state.inbox.find(m=>m.id===activeMail),list=state.inbox.filter(m=>mailScope==='all'||mailScope==='unread'&&!m.read||mailScope==='action'&&mailActionable(m)).slice().reverse();return `<div class="welcome row between wrap"><div><h1>${h(t('inbox'))}</h1><p>${h(t('mailUnread'))} ${n(unreadCount())}</p></div>${btn(t('mailMarkAll'),'mail-all')}</div><div class="tabs-inline">${DB.mailFilters.map(x=>btn(x.name,'mail-filter',`data-id="${h(x.id)}"`,mailScope===x.id?'selected':'')).join('')}</div><div class="cols equal"><section class="card mail-list">${list.length?list.map(m=>`<button type="button" class="mail-item ${m.read?'':'unread'} ${activeMail===m.id?'selected':''}" data-action="mail-open" data-id="${h(m.id)}"><span class="row between wrap"><span>${h(mailSender(m))}</span><time>${h(m.date)}</time></span><strong>${h(m.subject)}</strong><span class="row wrap">${!m.read?badge(t('mailUnread'),'green'):''}${mailActionable(m)?badge(t('mailAction'),'pink'):''}</span></button>`).join(''):`<div class="empty">${h(t('mailEmpty'))}</div>`}</section><section class="card mail-detail">${selected?`<div class="eyebrow">${h(mailSender(selected))} · ${h(selected.date)}</div><h2>${h(selected.subject)}</h2><p class="mail-body">${h(selected.body).replace(/\n/g,'<br>')}</p><div class="row wrap">${selected.action==='offer'&&state.offers.some(o=>o.id===selected.offer&&o.status==='open')?btn(t('negotiationOpen'),'mail-offer',`data-id="${h(selected.offer)}"`,'primary'):''}${selected.action==='deal'?btn(t('readMessage'),'deal-open',`data-id="${h(selected.deal)}"`,'primary'):''}${selected.reply==='coach'&&!selected.answered?DB.inboxReplies.map(r=>btn(r.name,'coach-reply',`data-id="${h(selected.id)}" data-reply="${h(r.id)}"`)).join(''):''}</div>`:`<div class="empty">${h(t('mailOpen'))}</div>`}</section></div>`;}
function mailActionable(m){return Boolean(m.reply==='coach'&&!m.answered||m.action==='offer'&&state.offers.some(o=>o.id===m.offer&&o.status==='open'&&o.expiresDate>=state.date)||m.action==='deal'&&state.deals.some(d=>d.id===m.deal&&['negotiating','ready'].includes(d.status)));}
function contractDetails(){const p=state.player,c=p.contract;return `<section class="card"><div class="section-head"><h2>${h(t('contractDetails'))}</h2>${badge(p.freeAgent?t('freeAgent'):currentClub().name,'green')}</div><div class="form-grid">${detail(t('weeklyWage'),money(c.weekly))}${detail(t('remaining'),t('contractYearsEnd',{n:c.expiresSeason}))}${detail(t('contractPromise'),roleName(c.role))}${detail(t('contractPosition'),c.position)}${DB.dealFields.filter(f=>!['fee','weekly','years','role','position','upfrontPercent','installmentMonths','sellOnPercent','agentCommissionPercent','arrival'].includes(f.id)).map(f=>detail(f.name,f.type==='money'?money(c[f.id]):n(c[f.id]))).join('')}</div><p class="small muted" style="margin-top:16px">${h(t('dealBudgetNote'))}</p>${p.freeAgent?'':`<div class="creation-actions">${btn(t('contractRenew'),'renew','','primary')}</div>`}</section>`;}
function agentCard(){const a=DB.agents.find(a=>a.id===state.agent.id);return `<section class="card"><div class="section-head"><h2>${h(t('agent'))}</h2>${badge(t('agentTrust')+' '+n(state.agent.trust))}</div><label>${h(t('agentSelect'))}<select id="agent-select">${options(DB.agents,state.agent.id)}</select></label><p class="small muted" style="margin:12px 0">${h(a.description)}</p><div class="row wrap">${btn(t('agentConsult'),'agent-consult')}</div><div class="divider"></div><label>${h(t('agentTarget'))}<select id="agent-target">${options(Object.values(idx().clubs).filter(c=>!c.parent&&(state.player.freeAgent||c.id!==state.player.club)).sort((a,b)=>a.quality-b.quality),state.player.dreamClub)}</select></label><div style="margin-top:15px">${btn(t('agentSeek'),'agent-seek','','primary')}</div><p class="small muted" style="margin-top:15px">${h(t('contactCooldown',{n:DB.dealRules.requestCooldownDays}))}</p></section>`;}
function negotiation(d){const c=idx().clubs[d.club],source=idx().clubs[d.sourceClub],live=['negotiating','ready'].includes(d.status),locked=!live||d.awaiting||d.status==='ready';return `<div class="welcome row between wrap"><div><div class="eyebrow">${h(t(d.kind==='renewal'?'contractRenew':d.kind==='callup'?'callupTitle':'negotiations'))}</div><h1>${h(c.name)}</h1><p>${h(t('negotiationRound',{n:d.round,max:DB.dealRules.maxRounds}))} · ${h(t('deadline'))} ${h(d.deadline)}</p></div>${btn(t('marketBack'),'deal-close')}</div><div class="row wrap" style="margin-bottom:20px">${badge(t(d.status),d.status==='ready'?'green':'')}${d.awaiting?badge(t('responseDate')+' '+d.responseDate,'pink'):''}</div><div class="kpi-grid" style="margin-bottom:20px">${kpi(t('seller'),source.name,t(d.seller.status))}${kpi(t('buyer'),c.name,t(d.buyer.status))}${kpi(t('agent'),DB.agents.find(a=>a.id===d.agent.id).name,t(d.agent.status))}${kpi(t('medical'),t(d.medical),state.player.injury?t('injured',{n:state.player.injury}):n(state.player.fitness)+' / '+DB.rules.scale)}</div><div class="cols equal" style="margin-bottom:20px"><section class="card"><h2>${h(t('seller'))}</h2><p class="small muted" style="margin:12px 0">${h(t(d.seller.minimum?d.seller.importance>=DB.dealRules.importanceThreshold?'sellerKeep':'sellerSell':'sellerFree'))}</p><div class="detail-list">${detail(t('askingFee'),money(d.seller.ask))}${detail(t('minimumFee'),money(d.seller.minimum))}${detail(t('replacement'),d.seller.replacementDate)}${detail(t('transferFeeBudget'),n(d.seller.upfront)+'%')}</div><div class="row wrap" style="margin-top:20px">${d.seller.minimum&&live&&!d.awaiting?`${!d.seller.permission?btn(t('askPermission'),'deal-interact',`data-id="${h(d.id)}" data-kind="permission"`):''}${!d.seller.requested?btn(t('requestTransfer'),'deal-interact',`data-id="${h(d.id)}" data-kind="request"`):''}${!d.seller.mediated?btn(t('agentMediation'),'deal-interact',`data-id="${h(d.id)}" data-kind="mediate"`):''}`:''}</div></section><section class="card"><h2>${h(t('buyer'))}</h2><div class="detail-list" style="margin-top:16px">${detail(t('maximumBudget'),money(d.buyer.budget))}${detail(t('maximumWeekly'),money(d.buyer.maxWeekly))}${detail(t('maximumRole'),roleName(d.buyer.role))}${detail(t('tacticalFit'),n(d.buyer.fit*DB.rules.scale)+'%')}${detail(t('contractPosition'),d.buyer.position)}</div><p class="small muted" style="margin-top:16px">${h(t('dealBudgetNote'))}</p></section></div>${arrivalPreview(d)}<form id="deal-form" data-id="${h(d.id)}"><fieldset ${locked?'disabled':''} class="card"><div class="section-head"><h2>${h(t('personal'))}</h2>${d.counter&&live&&!locked?btn(t('termsCounter'),'deal-counter',`data-id="${h(d.id)}"`):''}</div><div class="form-grid">${DB.dealFields.map(f=>`<label>${h(f.name)}${f.type==='money'?' · '+h(preferences.currency):''}${f.type==='role'?`<select name="${h(f.id)}">${options(DB.contractRoles,d.terms[f.id])}</select>`:f.type==='position'?`<select name="${h(f.id)}">${options(DB.positions,d.terms[f.id])}</select>`:f.type==='arrival'?d.kind==='transfer'?`<select name="${h(f.id)}">${options(DB.arrivalOptions,d.terms[f.id])}</select>`:`<input value="${h(t('contractImmediate'))}" disabled>`:`<input name="${h(f.id)}" type="number" value="${h(f.type==='money'?Number((d.terms[f.id]*currencyRate()).toFixed(DB.settings.moneyInputDigits)):d.terms[f.id])}" min="${f.type==='money'?f.min*currencyRate():f.min}" max="${f.type==='money'?f.max*currencyRate():f.max}" step="any" inputmode="decimal" required>`}</label>`).join('')}</div><div class="creation-actions"><p class="small muted">${h(t('transferRequestRisk'))}</p><button class="primary" type="submit">${h(t('negotiationSubmit'))}</button></div></fieldset></form><div class="row wrap" style="margin:20px 0">${live&&!d.awaiting?`${d.status==='ready'?`${btn(d.kind==='transfer'&&Core.arrivalPlan(DB,state,d.terms.arrival).date>state.date?t('arrivalSign',{date:Core.arrivalPlan(DB,state,d.terms.arrival).date}):t('negotiationComplete'),'deal-sign',`data-id="${h(d.id)}"`,'primary')}${btn(t('dealEdit'),'deal-edit',`data-id="${h(d.id)}"`)}`:''}${btn(t('negotiationWithdraw'),'deal-withdraw',`data-id="${h(d.id)}"`)}`:''}</div><section class="card"><h2>${h(t('negotiationHistory'))}</h2><div class="events">${d.log.slice().reverse().map(entry=>`<div class="event"><time>${h(entry.date)}</time><div>${h(entry.text)}</div></div>`).join('')}</div></section>`;}
function openDeal(club,kind='transfer'){const deal=Core.startDeal(DB,state,club,kind);if(!deal){toast(t(state.pendingTransfer?'arrivalBinding':'dealCapacity'));return;}activeDeal=deal.id;screen='market';reportId=null;persist();render();window.scrollTo({top:0});}
document.addEventListener('submit',event=>{if(event.target.id!=='deal-form')return;event.preventDefault();if(!event.target.reportValidity())return;const form=new FormData(event.target),terms=Object.fromEntries(DB.dealFields.map(f=>[f.id,f.type==='role'||f.type==='position'||f.type==='arrival'?String(form.get(f.id)||DB.dealDefaults.arrival):Number(form.get(f.id))/(f.type==='money'?currencyRate():1)]));if(Core.submitDeal(DB,state,event.target.dataset.id,terms)){persist();render();toast(t('negotiationWait'));}else toast(t('negotiationInvalid'));});
document.addEventListener('change',event=>{if(event.target.id==='agent-select'){const a=DB.agents.find(a=>a.id===event.target.value);if((state.pendingTransfer||state.deals.some(d=>['negotiating','ready'].includes(d.status)))){event.target.value=state.agent.id;toast(t('agentChangeBlocked'));return;}state.agent={id:a.id,trust:a.trust};persist();render();}});
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled||!state)return;const id=b.dataset.id,deal=state.deals.find(d=>d.id===id);switch(b.dataset.action){
 case 'mail-filter':mailScope=id;render();break;
 case 'mail-all':state.inbox.forEach(m=>m.read=true);persist();render();break;
 case 'mail-open':{activeMail=id;const m=state.inbox.find(m=>m.id===id);if(m)m.read=true;persist();render();break;}
 case 'mail-offer':{const o=state.offers.find(o=>o.id===id);if(o)openDeal(o.club);break;}
 case 'coach-reply':if(Core.replyCoach(DB,state,id,b.dataset.reply)){persist();render();}break;
 case 'deal-open':activeDeal=id;screen='market';persist();render();window.scrollTo({top:0});break;
 case 'deal-close':activeDeal=null;render();break;
 case 'deal-edit':if(deal?.status==='ready'){deal.status='negotiating';persist();render();}break;
 case 'deal-counter':if(deal?.counter&&!deal.awaiting){deal.terms=Core.clone(deal.counter);persist();render();}break;
 case 'deal-interact':if(Core.interactDeal(DB,state,id,b.dataset.kind)){persist();render();}break;
 case 'deal-withdraw':if(deal){deal.status='withdrawn';deal.awaiting=false;persist();render();}break;
 case 'deal-sign':if(Core.signDeal(DB,state,id)){persist();render();toast(t(state.pendingTransfer?'arrivalPending':'contractSigned'));}else{persist();render();toast(t('negotiationNotReady'));}break;
 case 'agent-seek':{const club=document.getElementById('agent-target').value;const ok=Core.seekClub(DB,state,club);persist();render();toast(t(ok?'agentInterest':'agentDeclined',{club:idx().clubs[club].name}));break;}
 case 'agent-consult':if(!state.agent.lastConsult||Core.dateAdd(state.agent.lastConsult,DB.dealRules.requestCooldownDays)<=state.date){state.agent.lastConsult=state.date;state.agent.trust=Core.clamp(state.agent.trust+DB.dealRules.agentReassurance,0,DB.rules.scale);Core.mail(DB,state,{subject:t('mailAgentSubject'),body:t('agentConsultBody'),from:DB.agents.find(a=>a.id===state.agent.id).name,fromRole:'agent'});persist();render();}else toast(t('contactCooldown',{n:DB.dealRules.requestCooldownDays}));break;
}});

let preferences={...DB.settings.defaults},selectedStatsSeason=null,worldSort={key:DB.settings.worldSortKey,direction:DB.settings.worldSortDirection};
const seasonLabel=number=>{const year=Number(DB.meta.initialDate.slice(0,4))+Number(number)-1;return String(year).slice(-DB.settings.seasonDigits)+'-'+String(year+1).slice(-DB.settings.seasonDigits);};
const abilityLabel=value=>n(Math.floor(value));
const displayMoney=value=>{const unit=DB.settings.currencies.find(c=>c.id===preferences.currency)||DB.settings.currencies[0];return new Intl.NumberFormat(DB.meta.locale,{style:'currency',currency:unit.id,maximumFractionDigits:0}).format(value*unit.rate);};
const worldNewsRelevant=item=>!DB.settings.noiseEvents.includes(item.type||item.event)||item.relatedPlayer||item.personName===state.player.name||(!item.personName&&String(item.text||'').includes(state.player.name));
function settings(){return `<div class="welcome"><h1>${h(t('settings'))}</h1><p>${h(t('settingsHint'))}</p></div><section class="card settings-card"><label>${h(t('screenLayout'))}<select id="setting-layout">${options(DB.settings.layoutOptions,preferences.layout)}</select></label><p class="small muted" style="margin-top:10px">${h(t('screenLayoutHint'))}</p><div class="divider"></div><label>${h(t('uiSize'))}<div class="row"><input id="setting-scale" type="range" min="${DB.settings.scale.min}" max="${DB.settings.scale.max}" step="${DB.settings.scale.step}" value="${preferences.scale}"><output id="setting-scale-value">${n(preferences.scale)}%</output></div></label><p class="small muted">${h(t('uiSizeHint'))}</p><div class="divider"></div><label>${h(t('moneyUnit'))}<select id="setting-currency">${options(DB.settings.currencies,preferences.currency)}</select></label><p class="small muted" style="margin:15px 0">${h(t('moneyUnitHint'))}</p><div class="notice">${h(t('moneyPreview'))} · ${money(DB.settings.moneyPreview)}</div><div class="divider"></div>${btn(t('settingsReset'),'settings-reset')}</section>`;}
function savePreferences(){try{localStorage.setItem(DEFAULT_DB.settings.storageKey,JSON.stringify(preferences));}catch{toast(t('storageFail'));}}
function loadPreferences(){try{const saved=JSON.parse(localStorage.getItem(DEFAULT_DB.settings.storageKey)||'null');if(saved&&DB.settings.currencies.some(c=>c.id===saved.currency)&&Number.isFinite(saved.scale)&&saved.scale>=DB.settings.scale.min&&saved.scale<=DB.settings.scale.max)preferences={...DB.settings.defaults,currency:saved.currency,scale:saved.scale,layout:DB.settings.layoutOptions.some(o=>o.id===saved.layout)?saved.layout:DB.settings.defaults.layout};}catch{}}
function seasonStatsSummary(){const seasons=Array.from({length:state.season},(_,i)=>i+1);return `<section class="card" style="margin-bottom:20px"><div class="section-head"><h2>${h(t('seasonRecords'))}</h2>${badge(t('allCareer'))}</div><div class="table-wrap"><table><thead><tr>${DB.settings.seasonStatColumns.map(c=>`<th>${h(t(c.label))}</th>`).join('')}</tr></thead><tbody>${seasons.slice().reverse().map(season=>{const stats=Core.totals(DB,state.player.history.filter(r=>r.season===season)),clubs=[...new Set(state.player.history.filter(r=>r.season===season).map(r=>idx().clubs[r.club].name))];return `<tr class="${season===(selectedStatsSeason??state.season)?'highlight':''}">${DB.settings.seasonStatColumns.map(c=>`<td>${c.id==='season'?btn(seasonLabel(season),'stats-season',`data-season="${season}"`,'subtle'):c.id==='club'?h(clubs.join(' · ')||(season===state.season?state.player.freeAgent?t('freeAgent'):currentClub().name:t('noStats'))):c.id==='rating'?stats.apps?n(stats.rating,2):h(t('noRating')):n(stats[c.id])}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div></section>`;}
function worldSortValue(p,key){if(key==='club')return idx().clubs[p.club].name;if(key==='overall')return p.stats?Core.overall(DB,p.stats):null;if(key==='potential')return p.traits?.potential??null;if(key==='minutes')return p.seasonMinutes??p.minutes??0;if(key==='style')return DB.identityStyles.find(x=>x.id===p.identityStyle)?.name||'';return p[key]??null;}
function world(){const w=state.world,i=idx(),all=Object.entries(w.rosters).flatMap(([club,list])=>list.map(p=>({...p,club}))),pool=worldScope==='retired'?w.retired:worldScope==='prospects'?all.filter(p=>p.age<=DB.dynamics.worldProspectAge):all,rows=pool.filter(p=>!worldQuery||(p.name+' '+i.clubs[p.club].name+' '+(p.position||'')).toLowerCase().includes(worldQuery.toLowerCase())).slice().sort((a,b)=>{const av=worldSortValue(a,worldSort.key),bv=worldSortValue(b,worldSort.key);if(av===null&&bv!==null)return 1;if(bv===null&&av!==null)return -1;const result=typeof av==='number'&&typeof bv==='number'?av-bv:String(av||'').localeCompare(String(bv||''),DB.meta.locale);return result*worldSort.direction||a.id.localeCompare(b.id);}),events=w.events.filter(worldNewsRelevant).slice(-DB.settings.worldNewsCount).reverse();return `<div class="welcome"><h1>${h(t('worldTitle'))}</h1><p>${h(t('worldHint'))}</p></div><div class="kpi-grid" style="margin-bottom:20px">${kpi(t('trend'),DB.dynamics.trends.find(x=>x.id===w.trend).name)}${kpi(t('player'),n(all.length))}${kpi(t('club'),n(Object.keys(w.clubs).length))}${kpi(t('retired'),n(w.retired.length))}</div><section class="card world-news" style="margin-bottom:20px"><div class="section-head"><h2>${h(t('worldEvents'))}</h2>${badge(events.length)}</div><div class="events">${events.map(e=>`<div class="event"><time>${h(e.date)}</time><div>${h(e.text)}</div></div>`).join('')}</div><p class="small muted" style="margin-top:12px">${h(t('worldNewsHint'))}</p></section><section class="card" style="margin-bottom:20px"><div class="section-head"><h2>${h(t('worldPlayerDatabase'))}</h2>${badge(n(pool.length))}</div><div class="tabs-inline">${DB.worldViews.map(v=>btn(v.name,'world-scope',`data-scope="${h(v.id)}"`,worldScope===v.id?'selected':'')).join('')}</div><label>${h(t('worldSearch'))}<input id="world-search" value="${h(worldQuery)}" placeholder="${h(t('worldSearchHint'))}"></label><div class="table-wrap" style="margin-top:16px"><table><thead><tr>${DB.settings.worldPlayerColumns.map(c=>`<th aria-sort="${worldSort.key===c.id?worldSort.direction<0?'descending':'ascending':'none'}">${btn(t(c.label)+(worldSort.key===c.id?worldSort.direction<0?' ↓':' ↑':''),'world-sort',`data-key="${h(c.id)}"`,'sort-heading')}</th>`).join('')}<th>${h(t('playerDetails'))}</th></tr></thead><tbody>${rows.slice(0,DB.dynamics.worldTableLimit).map(p=>`<tr>${DB.settings.worldPlayerColumns.map(c=>{const val=worldSortValue(p,c.id);return `<td>${val===null?'—':c.type==='number'?c.id==='overall'?abilityLabel(val):n(val):h(val)}</td>`;}).join('')}<td>${p.stats?btn(t('playerDetails'),'npc-detail',`data-id="${h(p.id)}"`,'subtle small'):'—'}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:15px">${h(t('worldSortHint',{n:DB.dynamics.worldTableLimit}))}</p></section><section class="card" style="margin-bottom:20px"><h2>${h(t('worldClubs'))}</h2><div class="table-wrap"><table><thead><tr>${['club','competition','clubPrestige','quality','manager','tacticalFit','finance','environment'].map(k=>`<th>${h(t(k))}</th>`).join('')}</tr></thead><tbody>${Object.values(i.clubs).map(c=>`<tr class="${c.id===state.player.club?'highlight':''}"><td>${h(c.name)}</td><td>${h(i.leagues[c.league].name)}</td><td>${h(clubTier(c))}</td><td>${n(c.quality,1)}</td><td>${h(c.manager.name)}</td><td>${h(Core.managerTactic(DB,state,c.id).name)}</td><td>${money(c.finance)}</td><td>${n(c.environment,1)}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>${h(t('seasonSnapshot'))}</h2>${w.snapshots.length?w.snapshots.slice().reverse().map(x=>`<div class="history-item"><b>${h(t('season',{n:x.season}))}</b><span>${h(DB.dynamics.trends.find(t=>t.id===x.trend).name)}</span><span>${h(x.leaders[0]?.name||'')} · ${n(x.leaders[0]?.goals||0)} ${h(t('goal'))}</span></div>`).join(''):`<p class="small muted">${h(t('noStats'))}</p>`}</section>`;}
document.addEventListener('input',event=>{if(event.target.id==='setting-scale'){preferences.scale=Core.clamp(Number(event.target.value),DB.settings.scale.min,DB.settings.scale.max);document.body.style.zoom=String(preferences.scale/DB.rules.scale);document.getElementById('setting-scale-value').textContent=n(preferences.scale)+'%';savePreferences();}});

function broadcastTimeline(record){

  items.push({minute:record.result.duration,type:'fulltime',order:cfg.halftimeOrder});return items.sort((a,b)=>a.minute-b.minute||a.order-b.order);
}

function screenSize(){return {width:window.screen.width,height:window.screen.height};}
function mailSender(m){const role=DB.senderRoles.find(r=>r.id===(m.fromRole||Core.senderRole(DB,state,m))),source=DB.ui.labels[m.from]||m.from,agent=DB.agents.find(a=>a.id===state.agent?.id),name=m.from==='mailSystem'?role?.name||source:m.from==='mailCoach'?t('mailCoach'):m.from==='mailAgent'?t('mailAgent'):source,sender=name===role?.name?name:t('senderWithRole',{role:role?.name||t('mailSystem'),name});return m.fromClub&&idx().clubs[m.fromClub]&&m.from!==idx().clubs[m.fromClub].name?t('senderWithClub',{sender,club:idx().clubs[m.fromClub].name}):sender;}
document.addEventListener('change',event=>{if(event.target.id==='setting-layout'&&DB.settings.layoutOptions.some(o=>o.id===event.target.value)){preferences.layout=event.target.value;savePreferences();render();}});
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(b?.dataset.action==='layout-toggle'){preferences.layout=preferences.layout==='desktop'?'auto':'desktop';savePreferences();render();}});

bootGame();
</script>
