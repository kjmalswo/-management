<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>제조업 경영 시뮬레이터</title>

<!--
■ 핵심 개발 지침 (절대 원칙):
  1. [하드코딩 절대 금지 및 DB화 위주 개발]:
     - 금리, 수수료, 임금, 손실률, 설비 비용, 티어 계수, 운송 노선, 공정 사양 등
       모든 수치와 비즈니스 로직 파라미터는 전용 DB 테이블에 중앙 집권화하여 관리한다.
     - 로직 및 렌더링 함수 내부에서 임의의 '매직 넘버(Magic Number)'나 인라인 하드코딩을 일체 금지하며, 데이터 추가 및 밸런스 패치가 DB 수정만으로 완결되도록 구조화한다.
  2. [명칭 정제 및 기본형 중심 현실성 확보]:
     - 과장되거나 작위적인 미사여구(초고성능, 하이엔드, 초임계, 기가스틸, 미슐랭 등)를 전면 배제한다.
     - 업종, 제품, 카테고리, 원자재, 협력사, 경쟁사, 마감 공법 등 모든 명칭을
       실제 제조업 현장에서 사용하는 담백하고 표준적인 기본 용어로 정제한다.
  3. [엔드투엔드 파이프라인 및 제약이론(TOC) 밸런싱]:
     - [1. 원자재 수급(Sourcing)] > [2. 인바운드 조달(Procurement)] >
       [3. 공장 제작 & 출하(Production/MES)] > [4. 운송/수출 & 물류(Logistics)]
     - 4대 공정의 처리 용량(CAPA) 불균형을 실시간 측정하고 최약 구간(병목)을 해결하는 흐름을 기본 게임 원리로 운용한다.
     -  또한 각 제조업 분야(업종)을 게임 전 선택하는 것으로 시작하여, 그에 해당하는 실제 시장 상황과 각종 요소들을 현실적으로 배치한다.
  4. [재무 관리 및 트레저리 운용]:
     - 실시간 영업현금흐름(매출 유입 - 원자재비 - 공장 운영비 = 순현금 증감)을 명확히 시각화한다.
     - 단기 유휴현금 정기예금(MMF), 대출, 채권, 주식 등을 통해 다양한 현금 흐름 구조를 가져갈 수 있도록 한다.
  5. [정밀 맞춤형 상품 기획 스튜디오]:

* 신규 상품 기획의 경우, 고정 선택지가 아닌, 플레이어가 제품명부터, 분류, 라인업(엔트리/중급/플래그십/스페셜),

       마감 공법, 원자재 투입비율, 목표 마진율 및 판매금액을 세세하게 직접 결정하여 양산에 착수한다.
  6. [기존 지침 및 스타일 유지]:
     - 단일 파일 완결성(HTML/CSS/JS), 이모지 사용 전면 배제, 세련된 태그 시스템, 라이트 테마에 밝은 형광 보라/ 밝은 핑크 테마, 반응형 애니메이션이 포함된 '뉴모피즘 UI'로 개발한다.
     - 또한 해당 지침 주석은 삭제하거나 간략화, 수정, 생략하지 말고 그대로 둔다. 하위의 코드만 수정한다.
  7. [버전 관리 규칙]:
     - 소규모 기능/버그/가시성 패치는 직전 버전에서 +0.1, 대규모 구조/시스템 업데이트는 +1.0으로 버전업한다.
  8. [가시성 개선과 시스템 복잡도 분리 원칙]:
     - 모든 편의성 및 가시성, 가독성, 직관성 개선의 목적은 사용자가 정보를 시각적으로 더 직관적이고 효율적으로 파악하도록 만드는 데 있다.
     - 하지만 이는 로직, 알고리즘, 시스템 자체를 단순화하거나 의사결정 요소를 제거하라는 의미가 아니며, 기존 또는 추가된 복합 상호작용과 현실성을 유지한 상태에서 표현과 탐색만 개선한다.
-->

<style>
:root{
  --bg:#f1edf9;
  --surface:#f1edf9;
  --surface-2:#f6f3fc;
  --sh-dark:#cdc4e4;
  --sh-light:#ffffff;
  --ink:#2f2a3d;
  --ink-2:#6b6383;
  --ink-3:#9a93ae;
  --accent:#b026ff;
  --accent-soft:#e9d5ff;
  --pink:#ff4fd8;
  --pink-soft:#ffddf6;
  --ok:#17b890;
  --warn:#f0a020;
  --bad:#f0426e;
  --line:rgba(120,100,160,.14);
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  --t:.28s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60vw 40vh at 8% -5%, rgba(176,38,255,.10), transparent 62%),
    radial-gradient(50vw 38vh at 98% 4%, rgba(255,79,216,.10), transparent 60%);
}
#app{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:18px 16px 60px}

/* ── 뉴모피즘 기본 표면 ───────────────────────────── */
.neu{background:var(--surface);border-radius:var(--r-lg);
  box-shadow:7px 7px 16px var(--sh-dark), -7px -7px 16px var(--sh-light);}
.neu-in{background:var(--surface);border-radius:var(--r-md);
  box-shadow:inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light);}
.neu-flat{background:var(--surface);border-radius:var(--r-md);
  box-shadow:4px 4px 10px var(--sh-dark), -4px -4px 10px var(--sh-light);}

/* ── 헤더 ─────────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:180px}
.brand b{font-size:15px;letter-spacing:-.02em}
.brand span{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.hdr-stats{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.hstat{padding:7px 13px;border-radius:var(--r-sm);min-width:98px;
  box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);}
.hstat i{display:block;font-style:normal;font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.hstat b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.hdr-ctl{display:flex;gap:9px;align-items:center}

/* ── 버튼 ─────────────────────────────────────────── */
.btn{border:0;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);
  background:var(--surface);padding:9px 16px;border-radius:var(--r-sm);
  box-shadow:4px 4px 10px var(--sh-dark), -4px -4px 10px var(--sh-light);
  transition:transform var(--t), box-shadow var(--t), color var(--t);letter-spacing:-.01em}
.btn:hover{transform:translateY(-2px);box-shadow:6px 6px 14px var(--sh-dark), -6px -6px 14px var(--sh-light);color:var(--accent)}
.btn:active{transform:translateY(0);box-shadow:inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none!important;color:var(--ink-3)}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--pink));
  box-shadow:5px 5px 13px rgba(176,38,255,.30), -4px -4px 11px var(--sh-light)}
.btn.primary:hover{color:#fff;box-shadow:7px 7px 18px rgba(255,79,216,.36), -5px -5px 13px var(--sh-light)}
.btn.sm{padding:6px 11px;font-size:11.5px;border-radius:9px}
.btn.on{color:var(--accent);box-shadow:inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light)}

/* ── 탭 ───────────────────────────────────────────── */
.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:9px 11px;margin-bottom:14px}
.tab{border:0;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:transparent;padding:8px 15px;border-radius:12px;transition:all var(--t);position:relative}
.tab:hover{color:var(--accent);transform:translateY(-1px)}
.tab.active{color:var(--accent);background:var(--surface);
  box-shadow:inset 3px 3px 8px var(--sh-dark), inset -3px -3px 8px var(--sh-light)}
.tab .dot{position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--pink);
  box-shadow:0 0 7px var(--pink);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* ── 레이아웃 ─────────────────────────────────────── */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:span 1}}

.card{padding:16px 17px;animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card h3{font-size:12.5px;font-weight:700;letter-spacing:.02em;margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .hint{font-size:10.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.card .sub{font-size:10.5px;color:var(--ink-3);margin-bottom:12px}
.sec-title{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.08em;margin:2px 0 9px}

/* ── 태그 시스템 ──────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.02em;
  padding:3px 9px;border-radius:999px;white-space:nowrap;transition:transform var(--t)}
.tag:hover{transform:translateY(-1px)}
.tag .pt{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* ── KPI ──────────────────────────────────────────── */
.kpi{padding:13px 15px;border-radius:var(--r-md);transition:transform var(--t);
  box-shadow:5px 5px 12px var(--sh-dark), -5px -5px 12px var(--sh-light)}
.kpi:hover{transform:translateY(-3px)}
.kpi i{display:block;font-style:normal;font-size:10px;color:var(--ink-3);letter-spacing:.05em;margin-bottom:5px}
.kpi b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{display:block;font-size:10px;color:var(--ink-3);margin-top:3px}
.up{color:var(--ok)} .dn{color:var(--bad)} .nt{color:var(--ink-2)}
.ac{color:var(--accent)} .pk{color:var(--pink)}

/* ── 파이프라인 / 바 ─────────────────────────────── */
.pipe{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:118px 1fr 116px;gap:11px;align-items:center}
@media(max-width:620px){.prow{grid-template-columns:96px 1fr;}.prow .pval{grid-column:2;text-align:right}}
.plabel{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.plabel em{font-style:normal;font-size:9.5px;color:var(--ink-3);font-weight:600}
.track{height:20px;border-radius:999px;position:relative;overflow:hidden;
  box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light)}
.fill{position:absolute;inset:2px auto 2px 2px;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.3,1);
  background:linear-gradient(90deg,var(--accent),var(--pink))}
.fill.neck{background:linear-gradient(90deg,#ff2f7a,#ff8ad2);animation:neckGlow 1.8s ease-in-out infinite}
@keyframes neckGlow{0%,100%{filter:saturate(1)}50%{filter:saturate(1.5) brightness(1.08)}}
.thr{position:absolute;top:0;bottom:0;width:2px;background:var(--ink-2);opacity:.45}
.pval{font-size:11.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pval em{display:block;font-style:normal;font-size:9.5px;color:var(--ink-3);font-weight:600}

/* ── 리스트/행 ────────────────────────────────────── */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-2);font-size:11.5px}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.item{padding:12px 13px;border-radius:var(--r-md);margin-bottom:10px;transition:transform var(--t),box-shadow var(--t);
  box-shadow:4px 4px 10px var(--sh-dark), -4px -4px 10px var(--sh-light)}
.item:hover{transform:translateY(-2px);box-shadow:6px 6px 14px var(--sh-dark), -6px -6px 14px var(--sh-light)}
.item.sel{box-shadow:inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light)}
.item-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.item-h b{font-size:13px;font-weight:700}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:7px;margin:8px 0}
.meta div{font-size:10px;color:var(--ink-3)}
.meta div b{display:block;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}

/* ── 입력 ─────────────────────────────────────────── */
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:10.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px;letter-spacing:.02em}
input[type=text],input[type=number],select{
  width:100%;border:0;outline:0;font-family:inherit;font-size:12.5px;color:var(--ink);
  background:var(--surface);padding:10px 12px;border-radius:var(--r-sm);
  box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
  transition:box-shadow var(--t)}
input[type=text]:focus,input[type=number]:focus,select:focus{
  box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light), 0 0 0 2px var(--accent-soft)}
select{appearance:none;cursor:pointer}
input[type=range]{width:100%;height:18px;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:var(--surface);
  box-shadow:inset 2px 2px 5px var(--sh-dark), inset -2px -2px 5px var(--sh-light)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:17px;height:17px;border-radius:50%;margin-top:-5px;
  background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:2px 2px 6px rgba(176,38,255,.4);
  transition:transform var(--t)}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:#e3dcf2}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--pink))}
.slrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.slrow .nm{width:104px;font-size:11px;color:var(--ink-2);font-weight:600;flex:none}
.slrow .vl{width:62px;text-align:right;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}

/* ── 로그 ─────────────────────────────────────────── */
.log{max-height:268px;overflow-y:auto;padding-right:5px}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:var(--sh-dark);border-radius:9px}
.lg{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px;animation:rise .3s both}
.lg .w{color:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums;flex:none;width:44px;padding-top:1px}
.lg .m{color:var(--ink-2);flex:1}

/* ── 업종 선택 ────────────────────────────────────── */
.intro{max-width:1080px;margin:0 auto;padding:30px 16px}
.intro-h{text-align:center;margin-bottom:26px}
.intro-h h1{font-size:27px;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(120deg,var(--accent),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-h p{font-size:12.5px;color:var(--ink-2);margin-top:8px}
.sector-card{padding:17px;cursor:pointer;transition:transform var(--t),box-shadow var(--t);
  box-shadow:6px 6px 14px var(--sh-dark), -6px -6px 14px var(--sh-light)}
.sector-card:hover{transform:translateY(-5px);box-shadow:9px 9px 20px var(--sh-dark), -9px -9px 20px var(--sh-light)}
.sector-card.sel{box-shadow:inset 5px 5px 11px var(--sh-dark), inset -5px -5px 11px var(--sh-light)}
.sector-card h4{font-size:15px;font-weight:800;margin-bottom:5px}
.sector-card p{font-size:11px;color:var(--ink-2);min-height:46px;margin-bottom:9px}

.spark{width:100%;height:64px;display:block}
.flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:var(--pink-soft)}100%{background:transparent}}
.mini{font-size:10.5px;color:var(--ink-3)}
.bar-mini{height:7px;border-radius:999px;position:relative;overflow:hidden;margin-top:5px;
  box-shadow:inset 2px 2px 5px var(--sh-dark), inset -2px -2px 5px var(--sh-light)}
.bar-mini i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:999px;display:block;
  background:linear-gradient(90deg,var(--accent),var(--pink));transition:width .5s}
.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.nowrap{white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:right;font-size:10px;color:var(--ink-3);font-weight:600;padding:6px 7px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:7px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.overlay{position:fixed;inset:0;background:rgba(241,237,249,.86);backdrop-filter:blur(4px);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .box{max-width:460px;padding:28px;text-align:center}
.overlay .box h2{font-size:19px;margin-bottom:9px}
.overlay .box p{font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
</style>
</head>
<body>
<div id="app"></div>

<script>

   ========================================================================== */
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const sum=a=>a.reduce((x,y)=>x+y,0);
const rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 금액 표기 — 단가 판단이 가능하도록 1,000만원 미만은 원 단위를 유지한다 */
function won(v){
  const a=Math.abs(v), s=v<0?"-":"";
  if(a>=1e12) return s+(a/1e12).toFixed(2)+"조";
  if(a>=1e8)  return s+(a/1e8).toFixed(2)+"억";
  if(a>=1e7)  return s+(a/1e4).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",")+"만";
  return s+Math.round(a).toLocaleString();
}
/* 비교표 내 단위 통일 — 한 표 안에서 원/만/억이 섞이면 대소 비교가 어렵다 */
function scaleOf(vals){
  const m=Math.max(...vals.map(v=>Math.abs(v)),1);
  if(m>=1e12) return {d:1e12,s:"조",f:2};
  if(m>=1e8)  return {d:1e8, s:"억",f:2};
  if(m>=1e4)  return {d:1e4, s:"만",f:0};
  return {d:1,s:"",f:0};
}
function wonAt(v,sc){
  const n=(v/sc.d).toLocaleString(undefined,{minimumFractionDigits:sc.f,maximumFractionDigits:sc.f});
  return n+sc.s;
}
const num=v=>Math.round(v).toLocaleString();
const dec=(v,d)=>Number(v).toFixed(d==null?1:d);
const pct=(v,d)=>(v*100).toFixed(d==null?1:d)+"%";
const M=id=>DB.materials.find(m=>m.id===id);
const EQ=id=>DB.equipment.find(e=>e.id===id);
const TIER=id=>DB.tiers.find(t=>t.id===id);

  const t=DB.tags[key]||DB.tags.mute;
  return `<span class="tag" style="color:${t.fg};background:${t.bg}"><span class="pt"></span>${esc(label||t.label)}</span>`;
}

/* ============================================================================
   [3] 게임 상태
   ========================================================================== */
let S=null, autoTimer=null;

function sec(){ return DB.sectors.find(s=>s.id===S.sectorId); }
function weeklyPotential(sc){ return sc.baseDemand*sc.refPrice; }     // 업종 주간 잠재매출
function sectorEquipment(sc){
  return DB.equipment.filter(e=>e.sectors==="all"||e.sectors.indexOf(sc.id)>=0);
}
function buildSuppliers(sc){
  const list=[]; let n=0;
  sc.materials.forEach((mid,mi)=>{
    const pool=DB.supplierNamePools[M(mid).pool]||DB.supplierNamePools.generic;
    DB.supplierGrades.forEach((g,gi)=>{
      const nm=pool[(mi*DB.supplierGrades.length+gi+sc.name.length)%pool.length];
      list.push({
        id:"sp_"+mid+"_"+g.id, name:nm, matId:mid, gradeId:g.id,
        capaKg:g.capaRatio*sc.matPerUnit*sc.baseDemand,
        lead:g.lead, defect:g.defect, priceFactor:g.priceFactor, qDelta:g.qDelta
      });
      n++;
    });
  });
  return list;
}

function defaultCompanyName(sc){ return `${sc.name} ${DB.config.defaultCompanySuffix}`; }

function newGame(sectorId,companyName){
  const sc=DB.sectors.find(s=>s.id===sectorId);
  const pot=weeklyPotential(sc);
  S={
    sectorId, companyName:(companyName&&companyName.trim())||defaultCompanyName(sc),
    editingName:false,
    week:DB.config.startWeek, running:false, over:null,
    cash:pot*DB.config.startCashRatio,
    brand:DB.config.brandStart,
    suppliers:buildSuppliers(sc),
    contracts:{},                 // supplierId -> 주간 계약물량(kg)
    matRaw:{}, matStock:{},       // 미검사 / 검사완료 원자재 재고(kg)
    inbound:[],                   // {matId, qty, eta, supId}
    equip:{},                     // eqId -> 보유 대수
    staff:{},                     // laborId -> 인원
    products:[], fg:{}, transit:[], marketStock:{},
    routes:{},                    // routeId -> 계약 여부
    ar:[], ap:[],
    deposits:[], loans:[], bonds:[], stocks:{},
    matPrice:{}, baseRate:DB.finance.baseRate,
    stockPrice:{}, bondYieldAdj:{},
    active:[],                    // 진행 중 이벤트
    log:[], history:[], ledger:null, lastCapa:null,
    seq:1, insolvency:0, tab:"dash",
    policy:DB.production.defaultPolicy,
    draft:null, selMat:null
  };
  sc.materials.forEach(mid=>{ S.matRaw[mid]=0; S.matStock[mid]=0; S.matPrice[mid]=M(mid).price; });
  DB.labor.forEach(l=>S.staff[l.id]=0);
  DB.finance.stocks.forEach(s=>{ S.stockPrice[s.id]=s.price; S.stocks[s.id]=0; });
  DB.finance.bonds.forEach(b=>S.bondYieldAdj[b.id]=0);

  // 초기 설비 무상 지급: 업종 필수 공정 그룹별 최소 1대
  const budget=pot*DB.config.startEquipCashRatio; let used=0;
  sc.reqGroups.concat(["inbound","outbound"]).forEach(g=>{
    const cands=sectorEquipment(sc).filter(e=>e.group===g).sort((a,b)=>a.capexRatio-b.capexRatio);
    if(cands.length && used+cands[0].capexRatio*pot<=budget*2){
      S.equip[cands[0].id]=(S.equip[cands[0].id]||0)+1; used+=cands[0].capexRatio*pot;
    }
  });
  // 초기 인력: 보유 설비 요구 인원 충족
  const need=laborNeed();
  DB.labor.forEach(l=>S.staff[l.id]=need[l.id]||0);

  S.draft=newDraft();
  pushLog(`${S.companyName} 법인을 ${sc.name} 업종으로 설립했다. 초기 현금 ${won(S.cash)}원.`,"accent");
  render();
}

function newDraft(){
  const sc=sec();
  const mix={}; const per=Math.round(100/sc.materials.length/DB.formulas.mixStep)*DB.formulas.mixStep;
  sc.materials.forEach((m,i)=>mix[m]=i===0?100-per*(sc.materials.length-1):per);
  return {
    name:"", catId:sc.categories[0].id, tierId:DB.tiers[1].id,
    finishId:sc.finishes[0], mix, margin:DB.formulas.marginDefault, priceOverride:null
  };
}

function pushLog(msg,tagKey){
  S.log.unshift({w:S.week,msg,tag:tagKey||"mute"});
  if(S.log.length>DB.config.logKeep) S.log.pop();
}

/* ── 브라우저 저장 ───────────────────────────────────
   저장 키에 버전을 결합해, 구조가 바뀌는 버전업 시 이전 세이브를
   자동으로 무효화한다(별도 마이그레이션 로직 없이 안전하게 새로 시작). */
function saveKey(){ return DB.config.saveKeyPrefix+DB.meta.version; }
function saveGame(){
  if(!S) return;
  try{ S.lastSavedWeek=S.week; localStorage.setItem(saveKey(), JSON.stringify(S)); }catch(e){ /* 저장 불가 환경은 무시 */ }
}
function loadGame(){
  try{
    const raw=localStorage.getItem(saveKey());
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(!obj||!obj.sectorId||!DB.sectors.some(s=>s.id===obj.sectorId)) return null;
    obj.running=false; obj.editingName=false;   // 자동 진행 상태·편집 상태는 이어받지 않는다
    if(!obj.companyName) obj.companyName=defaultCompanyName(DB.sectors.find(s=>s.id===obj.sectorId));
    return obj;
  }catch(e){ return null; }
}
function clearSave(){
  try{ localStorage.removeItem(saveKey()); }catch(e){ /* 무시 */ }
}

/* ============================================================================
   [4] 파생 계산 — 인력 / CAPA / 품질 / 원가 / 수요
   ========================================================================== */
function laborNeed(){
  const need={}; DB.labor.forEach(l=>need[l.id]=0);
  Object.keys(S.equip).forEach(eid=>{
    const e=EQ(eid), n=S.equip[eid]||0;
    Object.keys(e.labor).forEach(lid=>need[lid]+=e.labor[lid]*n);
  });
  need.lb_proc += Math.ceil(Object.keys(S.contracts).length/DB.config.contractsPerBuyer);
  need.lb_maint+= Math.ceil(sum(Object.values(S.equip))/DB.config.equipPerMaint);
  return need;
}
function laborRatio(){
  const need=laborNeed(), r={};
  DB.labor.forEach(l=>{
    r[l.id]= need[l.id]<=0 ? 1 :
      clamp(S.staff[l.id]/need[l.id], DB.formulas.capaLaborFloor, 1);
  });
  return r;
}
function uptime(){
  const r=laborRatio();
  return clamp(DB.config.uptimeBase + DB.config.uptimeMaintBonus*r.lb_maint, 0, 1);
}
function eventMod(key){
  let v=0; S.active.forEach(a=>{ const e=DB.events.find(x=>x.id===a.id); if(e.eff[key]!=null) v+=e.eff[key]; });
  return v;
}
function groupCapa(g){
  const sc=sec(); let c=0;
  Object.keys(S.equip).forEach(eid=>{ const e=EQ(eid); if(e.group===g) c+=e.capaRatio*sc.baseDemand*(S.equip[eid]||0); });
  return c;
}
function avgFinishPenalty(){
  const act=S.products.filter(p=>p.active&&p.alloc>0);
  if(!act.length) return 0;
  return sum(act.map(p=>FIN(p.finishId).capaPenalty*p.alloc))/Math.max(1,sum(act.map(p=>p.alloc)));
}
function avgTierCapaFactor(){
  const act=S.products.filter(p=>p.active&&p.alloc>0);
  if(!act.length) return 1;
  return sum(act.map(p=>TIER(p.tierId).capaFactor*p.alloc))/Math.max(1,sum(act.map(p=>p.alloc)));
}

/* 4대 공정 CAPA(제품 단위/주) */
function capacities(){
  const sc=sec(), r=laborRatio(), up=uptime();

  const contractedKg=sum(Object.keys(S.contracts).map(id=>S.contracts[id]));
  const source = (contractedKg/sc.matPerUnit)*r.lb_proc;

  const procure = groupCapa("inbound")*r.lb_proc*up;

  const prodGroups={}; let prodMin=Infinity;
  const need=sc.reqGroups.slice();
  if(S.products.some(p=>p.active&&p.alloc>0&&FIN(p.finishId).group)) need.push("finishing");
  need.forEach(g=>{ const c=groupCapa(g); prodGroups[g]=c; prodMin=Math.min(prodMin,c); });
  if(!isFinite(prodMin)) prodMin=0;
  const produce = prodMin*r.lb_prod*up*(1-avgFinishPenalty())*avgTierCapaFactor()*(1+eventMod("prodCapa"));

  let routeCapa=0;
  Object.keys(S.routes).forEach(rid=>{ if(S.routes[rid]) routeCapa+=RT(rid).capaRatio*sc.baseDemand; });
  const outCapa=groupCapa("outbound");
  const ship = Math.min(routeCapa, outCapa)*r.lb_logi*(1+eventMod("shipCapa"));

  const vals={source:Math.max(0,source), procure:Math.max(0,procure),
              produce:Math.max(0,produce), ship:Math.max(0,ship)};
  let neck="source", min=Infinity;
  DB.stages.forEach(s=>{ if(vals[s.id]<min){min=vals[s.id];neck=s.id;} });

  /* 외부 제약(시장 수요)과 생산 계획량 산정 */
  const demand=sum(S.products.filter(p=>p.active).map(p=>totalDemand(p)));
  const held=sum(S.products.filter(p=>p.active).map(p=>onHandUnits(p)));
  const pull=S.policy===DB.production.policies[0].id;
  const plan=pull
    ? clamp(demand+Math.max(0,demand*avgCoverage()-held), 0, vals.produce)
    : vals.produce;
  const binding = demand<min ? DB.externalConstraint.id : neck;

  return {vals, neck, throughput:min, demand, plan, held, binding,
          prodGroups, routeCapa, outCapa, up, ratio:r};
}
/* 해당 품목이 사내·운송중·시장에 보유한 총 완제품 수량 */
function onHandUnits(p){
  let v=S.fg[p.id]||0;
  S.transit.forEach(t=>{ if(t.pid===p.id) v+=t.qty; });
  const ms=S.marketStock[p.id]||{}; Object.keys(ms).forEach(k=>v+=ms[k]);
  return v;
}
function avgCoverage(){
  const act=S.products.filter(p=>p.active&&p.alloc>0);
  if(!act.length) return DB.production.coverage.def;
  return sum(act.map(p=>p.coverage*p.alloc))/Math.max(1,sum(act.map(p=>p.alloc)));
}

/* 품질지수 */
function qualityOf(p){
  const w=DB.formulas.qualityWeights, sc=sec(), r=laborRatio();
  let mq=0; Object.keys(p.mix).forEach(mid=>{
    const supQ=bestContractQ(mid);
    mq += (p.mix[mid]/100)*(M(mid).q+supQ);
  });
  const fq=FIN(p.finishId).qBonus;
  let eqBonus=0, cnt=0;
  Object.keys(S.equip).forEach(eid=>{ const e=EQ(eid); if(e.stage==="produce"){eqBonus+=e.qBonus*(S.equip[eid]||0);cnt+=(S.equip[eid]||0);} });
  eqBonus = cnt? eqBonus/cnt : 0;
  const tierPush=TIER(p.tierId).materialFactor-1;
  const q = w.material*mq + w.finish*(fq*10) + w.equipment*(eqBonus*6) + w.qc*r.lb_qc + tierPush*0.25;
  return clamp(q, DB.formulas.qualityFloor, DB.formulas.qualityCap);
}
function bestContractQ(mid){
  let best=0;
  Object.keys(S.contracts).forEach(sid=>{
    const sp=S.suppliers.find(x=>x.id===sid);
    if(sp&&sp.matId===mid) best=Math.max(best,sp.qDelta);
  });
  return best;
}

/* 가공비 배부 기준 조업도 — 생산 계획량을 분모로 삼는다.
   고정비는 '만든 수량'이 아니라 '팔리는 수량'에서 회수되므로
   판매 가능량 = min(시장 수요, 공정 처리량)을 분모로 삼는다. 설비 능력을 분모로 쓰면 시장 제약 구간에서 조업도 차이
   (미회수 고정비)가 그대로 손실로 쌓인다. 하한 조업도율과 절대 하한으로
   수요 0 구간의 발산을 막는다.                                              */
function costingBase(){
  const sc=sec(), cfg=DB.config, cap=capacities();
  return Math.max(Math.min(cap.demand, cap.throughput),
                  cap.vals.produce*cfg.costMinUtilRate,
                  sc.baseDemand*cfg.costDenomFloorRatio);
}

/* 단위 원가 */
function unitCost(p,capaOverride){
  const sc=sec(), tier=TIER(p.tierId), cat=sc.categories.find(c=>c.id===p.catId);
  const kg=sc.matPerUnit*tier.materialFactor*cat.sizeFactor;
  let matUnit=0; Object.keys(p.mix).forEach(mid=>{ matUnit+=(p.mix[mid]/100)*curMatPrice(mid)*matPriceFactor(mid); });
  /* 수율 반영 — 입고 검사 불합격분과 운송 손실분까지 회수해야 실제 원가가 맞는다 */
  const material=kg*matUnit/Math.max(0.5, inboundYield(p))/Math.max(0.5, 1-avgRouteLoss());
  const finish=FIN(p.finishId).costRatio*sc.refPrice*cat.priceFactor;
  const cap=capaOverride!=null&&capaOverride>0?capaOverride:costingBase();
  const conversion=(weeklyOpex()+weeklyWage())/cap;
  const logi=avgRouteCostRatio()*sc.refPrice*cat.priceFactor;
  const total=material+finish+conversion+logi;
  return {material, finish, conversion, logistics:logi, total, kg};
}
/* 투입 비율 가중 입고 양품률 */
function inboundYield(p){
  let y=0, w=0;
  Object.keys(p.mix).forEach(mid=>{
    const r=p.mix[mid]/100; if(r<=0) return;
    y+=r*DB.config.inspectYieldBase*(1-avgDefect(mid)); w+=r;
  });
  return w>0 ? y/w : DB.config.inspectYieldBase;
}
/* 판매 시장 비중 가중 운송 손실률 */
function avgRouteLoss(){
  const on=Object.keys(S.routes).filter(r=>S.routes[r]);
  if(!on.length) return DB.routes[0].loss;
  let w=0, l=0;
  DB.markets.forEach(mk=>{
    const rs=on.filter(r=>RT(r).market===mk.id);
    if(!rs.length) return;
    l+=Math.min(...rs.map(r=>RT(r).loss))*mk.demandFactor; w+=mk.demandFactor;
  });
  return w>0 ? l/w : DB.routes[0].loss;
}
/* 계획 생산량에 대응하는 실제 원자재 소요 중량 — 품목별 규격 계수를 반영한다 */
function planMaterialKg(units){
  const act=S.products.filter(p=>p.active&&p.alloc>0);
  if(!act.length) return units*sec().matPerUnit;
  const tot=sum(act.map(p=>p.alloc))||1;
  return sum(act.map(p=>units*(p.alloc/tot)*unitCost(p).kg/Math.max(0.5,inboundYield(p))));
}
function curMatPrice(mid){ return S.matPrice[mid]; }
function matPriceFactor(mid){
  let f=1;
  Object.keys(S.contracts).forEach(sid=>{
    const sp=S.suppliers.find(x=>x.id===sid);
    if(sp&&sp.matId===mid) f=Math.min(f,sp.priceFactor);
  });
  return f;
}
/* 단위 물류비 배부 — 계약 노선 단순 평균이 아니라, 실제 판매 시장 비중으로
   가중한다. 시장별로는 출하 로직과 동일하게 최저운임 노선을 기준으로 삼는다.
   (단순 평균 시 고운임 노선 1개 개설이 내수 판매 원가까지 끌어올린다)        */
function avgRouteCostRatio(){
  const on=Object.keys(S.routes).filter(r=>S.routes[r]);
  if(!on.length) return DB.routes[0].costRatio;
  let w=0, c=0;
  DB.markets.forEach(mk=>{
    const rs=on.filter(r=>RT(r).market===mk.id);
    if(!rs.length) return;
    c+=Math.min(...rs.map(r=>RT(r).costRatio))*mk.demandFactor; w+=mk.demandFactor;
  });
  return w>0 ? c/w : DB.routes[0].costRatio;
}
function weeklyOpex(){
  const pot=weeklyPotential(sec()); let v=0;
  Object.keys(S.equip).forEach(eid=>{ const e=EQ(eid); v+=e.capexRatio*pot*e.opexRatio*(S.equip[eid]||0); });
  return v;
}
function weeklyWage(){
  let v=0; DB.labor.forEach(l=>v+=l.wage*(S.staff[l.id]||0)*(1+eventMod("wage")));
  return v;
}
function capexOf(eid){ return EQ(eid).capexRatio*weeklyPotential(sec()); }
function equipAsset(){
  let v=0; Object.keys(S.equip).forEach(eid=>v+=capexOf(eid)*(S.equip[eid]||0));
  return v;
}
function suggestedPrice(p){
  const c=unitCost(p);
  const sc=sec(), cat=sc.categories.find(x=>x.id===p.catId);
  const base=c.total*(1+p.margin);
  const ref=sc.refPrice*cat.priceFactor*TIER(p.tierId).priceFactor;
  return {cost:c, price:base, ref};
}

/* 수요 점유 모델 */
function marketPotential(mkId){
  const sc=sec(), mk=MK(mkId);
  const q=Math.floor(((S.week-1)/(DB.config.weeksPerYear/4))%4);
  return sc.baseDemand*mk.demandFactor*sc.season[q]*(1+eventMod("demand"));
}
function productScore(p){
  const sc=sec(), cat=sc.categories.find(c=>c.id===p.catId), tier=TIER(p.tierId), f=DB.formulas;
  const ref=sc.refPrice*cat.priceFactor*tier.priceFactor;
  const pc=Math.pow(ref/Math.max(1,p.price), f.priceElasticity);
  let qs=Math.pow(Math.max(0.02,p.quality), f.qualityElasticity);
  if(p.quality<tier.reqQuality) qs*= (1-f.tierFitPenalty*(tier.reqQuality-p.quality)/Math.max(0.01,tier.reqQuality));
  const bs=Math.pow(S.brand, f.brandElasticity);
  return Math.max(0, pc*qs*bs*tier.demandFactor);
}
function competitorScore(c){
  const f=DB.formulas;
  return Math.pow(1/c.price, f.priceElasticity)*Math.pow(c.quality, f.qualityElasticity)*Math.pow(c.brand, f.brandElasticity)*c.share*DB.tiers[1].demandFactor;
}
function demandOf(p,mkId){
  const sc=sec();
  const mine=S.products.filter(x=>x.active).map(x=>productScore(x));
  const comp=sum(sc.competitors.map(competitorScore));
  const tot=sum(mine)+comp;
  if(tot<=0) return 0;
  const share=productScore(p)/tot;
  return marketPotential(mkId)*share;
}
function totalDemand(p){ return sum(DB.markets.filter(m=>hasRouteTo(m.id)).map(m=>demandOf(p,m.id))); }
function hasRouteTo(mkId){ return Object.keys(S.routes).some(r=>S.routes[r]&&RT(r).market===mkId); }

/* 재무 집계 */
function totalDebt(){ return sum(S.loans.map(l=>l.balance)); }
function invValue(){
  let v=0; const sc=sec();
  Object.keys(S.matStock).forEach(m=>v+=(S.matStock[m]+S.matRaw[m])*curMatPrice(m));
  S.products.forEach(p=>{
    v+=(S.fg[p.id]||0)*unitCost(p).total;
    const ms=S.marketStock[p.id]||{}; Object.keys(ms).forEach(k=>v+=ms[k]*unitCost(p).total);
  });
  S.transit.forEach(t=>{ const p=S.products.find(x=>x.id===t.pid); if(p) v+=t.qty*unitCost(p).total; });
  return v;
}
function investValue(){
  let v=sum(S.deposits.map(d=>d.amount));
  v+=sum(S.bonds.map(b=>b.units*bondPrice(b.bondId)));
  Object.keys(S.stocks).forEach(sid=>v+=S.stocks[sid]*S.stockPrice[sid]);
  return v;
}
function bondPrice(bid){
  const b=DB.finance.bonds.find(x=>x.id===bid);
  const y=S.baseRate+b.coupon+S.bondYieldAdj[bid];
  const c=S.baseRate+b.coupon;
  return b.face*(1+(c-y)*b.duration);
}
function totalAsset(){ return S.cash+investValue()+invValue()+equipAsset()+sum(S.ar.map(a=>a.amount)); }
function equity(){ return totalAsset()-totalDebt()-sum(S.ap.map(a=>a.amount)); }
function loanLimit(l){
  const base = l.base==="equip"? equipAsset() : totalAsset();
  const used = sum(S.loans.filter(x=>x.type===l.id).map(x=>x.balance));
  return Math.max(0, base*l.limitRatio-used);
}

/* ============================================================================
   [5] 주간 틱 엔진 — 수급 > 조달 > 생산 > 물류 > 판매 > 재무
   ========================================================================== */
function tick(){
  if(S.over) return;
  const sc=sec(), cfg=DB.config, L={};
  const cap=capacities(); S.lastCapa=cap;
  L.week=S.week;

  /* 5-1 시장 파라미터 변동 ------------------------------------------- */
  sc.materials.forEach(mid=>{
    const m=M(mid);
    const drift=eventMod("matPrice")/cfg.eventDriftWeeks;
    const rev=(m.price-S.matPrice[mid])/S.matPrice[mid]*cfg.matReversion;   // 평균회귀
    S.matPrice[mid]=clamp(S.matPrice[mid]*(1+rnd(-m.vol,m.vol)+drift+rev),
                          m.price*cfg.matPriceMin, m.price*cfg.matPriceMax);
  });
  S.baseRate=clamp(S.baseRate+rnd(-DB.finance.rateVol,DB.finance.rateVol)+eventMod("rate"),
                   DB.finance.rateMin, DB.finance.rateMax);
  DB.finance.stocks.forEach(s=>{
    S.stockPrice[s.id]=Math.max(s.price*0.15, S.stockPrice[s.id]*(1+s.drift+rnd(-s.vol,s.vol)));
  });
  DB.finance.bonds.forEach(b=>{ S.bondYieldAdj[b.id]=clamp(S.bondYieldAdj[b.id]+rnd(-DB.finance.rateVol,DB.finance.rateVol),-0.02,0.02); });

  /* 5-2 원자재 수급: 소요량 기반 발주(MRP)
     계약 물량 전량을 기계적으로 인수하지 않고, 생산 계획 소요량과
     목표 재고(적정 재고 주수) 편차만큼만 발주해 과잉 매입을 억제한다.     */
  let matSpend=0;
  const planUnits= Math.min(cap.plan, cap.throughput);   // 실제 파이프라인 통과 가능량
  const actP=S.products.filter(p=>p.active&&p.alloc>0);
  const allocT=sum(actP.map(p=>p.alloc))||1;

  /* 자재별 소요량 전개(BOM) — 일괄 균등 발주 시 특정 자재만 고갈되어
     나머지 재고를 쌓아둔 채 라인이 정지한다.                              */
  const reqByMat={}; sc.materials.forEach(m=>reqByMat[m]=0);
  actP.forEach(p=>{
    const c=unitCost(p), units=planUnits*(p.alloc/allocT), y=Math.max(0.5,inboundYield(p));
    Object.keys(p.mix).forEach(mid=>{ reqByMat[mid]+=units*c.kg*(p.mix[mid]/100)/y; });
  });

  /* 자재별 발주량 = 주간 소요 + 목표 재고 편차 분할 */
  const orderByMat={}; let orderKg=0;
  sc.materials.forEach(mid=>{
    const onHand=S.matStock[mid]+S.matRaw[mid]
               + sum(S.inbound.filter(b=>b.matId===mid).map(b=>b.qty));
    const target=reqByMat[mid]*cfg.materialBufferWeeks;
    orderByMat[mid]=Math.max(0, reqByMat[mid]+(target-onHand)/cfg.materialBufferWeeks);
    orderKg+=orderByMat[mid];
  });

  /* 수급 CAPA 한도를 전체 발주량에 비례 배분 */
  const srcCapKg=cap.vals.source*sc.matPerUnit;
  const capRatio=orderKg>0 ? clamp(srcCapKg/orderKg,0,1) : 0;
  const contractByMat={};
  Object.keys(S.contracts).forEach(sid=>{
    const sp=S.suppliers.find(x=>x.id===sid); if(!sp) return;
    contractByMat[sp.matId]=(contractByMat[sp.matId]||0)+S.contracts[sid];
  });
  L.orderKg=orderKg; L.reqByMat=reqByMat;

  Object.keys(S.contracts).forEach(sid=>{
    const sp=S.suppliers.find(x=>x.id===sid); if(!sp) return;
    const cm=contractByMat[sp.matId]||0; if(cm<=0) return;
    const share=S.contracts[sid]/cm;                       // 동일 자재 내 공급사 배분
    const g=DB.supplierGrades.find(x=>x.id===sp.gradeId);
    const needQty=Math.min(S.contracts[sid], orderByMat[sp.matId]*share*capRatio);
    const qty=Math.max(S.contracts[sid]*g.minTake, needQty);   // 최소 인수 의무
    if(qty<=0) return;
    if(qty>needQty) L.forcedKg=(L.forcedKg||0)+(qty-needQty);
    const cost=qty*curMatPrice(sp.matId)*sp.priceFactor;
    matSpend+=cost;
    S.ap.push({amount:cost, due:S.week+cfg.apWeeks});
    S.inbound.push({matId:sp.matId, qty, eta:S.week+sp.lead+Math.round(eventMod("lead")), supId:sid});
  });
  L.matSpend=matSpend;

  /* 5-3 입고 및 인바운드 조달 ---------------------------------------- */
  let arrivedKg=0;
  S.inbound=S.inbound.filter(b=>{
    if(b.eta<=S.week){ S.matRaw[b.matId]+=b.qty; arrivedKg+=b.qty; return false; }
    return true;
  });
  const procKg=cap.vals.procure*sc.matPerUnit;
  let rawTotal=sum(sc.materials.map(m=>S.matRaw[m]));
  const procRatio = rawTotal>0? Math.min(1, procKg/rawTotal) : 0;
  let inspLoss=0;
  sc.materials.forEach(mid=>{
    const moved=S.matRaw[mid]*procRatio;
    const yieldRate=cfg.inspectYieldBase*(1-avgDefect(mid));
    S.matStock[mid]+=moved*yieldRate; inspLoss+=moved*(1-yieldRate);
    S.matRaw[mid]-=moved;
  });
  L.inspLoss=inspLoss; L.arrivedKg=arrivedKg;

  /* 5-4 공장 제작 ----------------------------------------------------- */
  const act=S.products.filter(p=>p.active&&p.alloc>0);
  const allocSum=sum(act.map(p=>p.alloc))||1;
  let produced=0;
  act.forEach(p=>{
    p.quality=qualityOf(p);
    const target=cap.plan*(p.alloc/allocSum);
    const c=unitCost(p);
    let maxByMat=Infinity;
    Object.keys(p.mix).forEach(mid=>{
      const per=c.kg*(p.mix[mid]/100);
      if(per>0) maxByMat=Math.min(maxByMat, S.matStock[mid]/per);
    });
    const qty=Math.max(0,Math.floor(Math.min(target, maxByMat)));
    if(qty>0){
      Object.keys(p.mix).forEach(mid=>{ S.matStock[mid]-=qty*c.kg*(p.mix[mid]/100); });
      S.fg[p.id]=(S.fg[p.id]||0)+qty; produced+=qty; p.produced+=qty;
    }
    p.lastPlan=target; p.lastMade=qty; p.unitCostNow=c.total;
  });
  L.produced=produced;

  /* 5-5 운송·물류 ----------------------------------------------------- */
  let shipCost=0, shipped=0, lossQty=0;
  const onRoutes=Object.keys(S.routes).filter(r=>S.routes[r]);
  if(onRoutes.length){
    const needByMk={}; DB.markets.forEach(m=>needByMk[m.id]=0);
    act.forEach(p=>DB.markets.forEach(m=>{ if(hasRouteTo(m.id)) needByMk[m.id]+=demandOf(p,m.id); }));
    const needTot=sum(Object.values(needByMk))||1;
    let budget=cap.vals.ship;
    onRoutes.sort((a,b)=>RT(a).costRatio-RT(b).costRatio).forEach(rid=>{
      const rt=RT(rid);
      let cap_r=Math.min(rt.capaRatio*sc.baseDemand, budget*(needByMk[rt.market]/needTot)+1);
      S.products.filter(p=>(S.fg[p.id]||0)>0).forEach(p=>{
        if(cap_r<=0||budget<=0) return;
        const want=Math.min(S.fg[p.id], cap_r, budget, Math.max(1,demandOf(p,rt.market)*rt.transit));
        const q=Math.floor(want); if(q<=0) return;
        const cat=sc.categories.find(c=>c.id===p.catId);
        shipCost+=q*rt.costRatio*sc.refPrice*cat.priceFactor;
        const loss=q*rt.loss; lossQty+=loss;
        S.fg[p.id]-=q; cap_r-=q; budget-=q; shipped+=q;
        S.transit.push({pid:p.id, mk:rt.market, qty:q-loss, eta:S.week+rt.transit});
      });
    });
  }
  S.transit=S.transit.filter(t=>{
    if(t.eta<=S.week){
      S.marketStock[t.pid]=S.marketStock[t.pid]||{};
      S.marketStock[t.pid][t.mk]=(S.marketStock[t.pid][t.mk]||0)+t.qty; return false;
    }
    return true;
  });
  L.shipCost=shipCost; L.shipped=shipped; L.lossQty=lossQty;

  /* 5-6 판매 ---------------------------------------------------------- */
  let revenue=0, soldQty=0;
  S.products.forEach(p=>{
    const ms=S.marketStock[p.id]; if(!ms) return;
    DB.markets.forEach(mk=>{
      const st=ms[mk.id]||0; if(st<=0) return;
      const d=demandOf(p,mk.id)*(1+rnd(-DB.formulas.demandNoise,DB.formulas.demandNoise));
      const sold=Math.min(st, Math.max(0,d));
      const expFx = mk.id===DB.markets[0].id ? 0 : eventMod("exportPrice");
      const rev=sold*p.price*mk.priceFactor*(1-mk.tariff)*(1+expFx);
      revenue+=rev; soldQty+=sold;
      ms[mk.id]=(st-sold)*(1-DB.config.marketStockDecay);
      p.sold+=sold; p.revenue+=rev;
    });
  });
  if(revenue>0) S.ar.push({amount:revenue, due:S.week+cfg.arWeeks});
  S.brand=clamp(S.brand*(1-cfg.brandDecay)+revenue*cfg.brandGainRatio+eventMod("brand")*0.1,
                cfg.brandMin, cfg.brandMax);
  L.revenue=revenue; L.soldQty=soldQty;

  /* 5-7 비용 및 현금 정산 --------------------------------------------- */
  const opex=weeklyOpex(), wage=weeklyWage();
  const holdCost=invValue()*cfg.fgHoldCostRatio+sum(sc.materials.map(m=>(S.matStock[m]+S.matRaw[m])*curMatPrice(m)))*cfg.matHoldCostRatio;
  let cashIn=0, cashOut=0;
  S.ar=S.ar.filter(a=>{ if(a.due<=S.week){cashIn+=a.amount;return false;} return true; });
  S.ap=S.ap.filter(a=>{ if(a.due<=S.week){cashOut+=a.amount;return false;} return true; });
  L.cashIn=cashIn; L.apPaid=cashOut; L.opex=opex; L.wage=wage; L.hold=holdCost;

  /* 금융 손익 */
  let finIn=0, finOut=0;
  S.deposits=S.deposits.filter(d=>{
    const p=DB.finance.deposits.find(x=>x.id===d.type);
    const r=(S.baseRate+p.spread)/DB.config.weeksPerYear;
    d.accrued+=d.amount*r;
    if(p.term>0 && S.week>=d.matures){ finIn+=d.amount+d.accrued; pushLog(`${p.name} 만기 해지. 원리금 ${won(d.amount+d.accrued)}원 입금.`,"ok"); return false; }
    if(p.term===0){ finIn+=d.accrued; d.accrued=0; }
    return true;
  });
  S.loans.forEach(l=>{
    const p=DB.finance.loans.find(x=>x.id===l.type);
    const r=(S.baseRate+p.spread)/DB.config.weeksPerYear;
    const interest=l.balance*r;
    const principal=Math.min(l.balance, l.principalPerWeek);
    finOut+=interest+principal; l.balance-=principal; l.paidInterest+=interest;
  });
  S.loans=S.loans.filter(l=>l.balance>1);
  S.bonds=S.bonds.filter(b=>{
    const bd=DB.finance.bonds.find(x=>x.id===b.bondId);
    const cpn=b.units*bd.face*((S.baseRate+bd.coupon)/DB.config.weeksPerYear);
    if(Math.random()<bd.defaultRate/DB.config.weeksPerYear){
      pushLog(`${bd.name} 발행사 신용사건 발생. 보유분 손실 처리.`,"risk"); return false;
    }
    finIn+=cpn;
    if(S.week>=b.matures){ finIn+=b.units*bd.face; pushLog(`${bd.name} 만기 상환 ${won(b.units*bd.face)}원.`,"ok"); return false; }
    return true;
  });
  if(S.week%DB.finance.dividendEvery===0){
    DB.finance.stocks.forEach(s=>{ const n=S.stocks[s.id]||0; if(n>0) finIn+=n*S.stockPrice[s.id]*s.dividend; });
  }
  L.finIn=finIn; L.finOut=finOut;

  const net=cashIn+finIn-cashOut-opex-wage-holdCost-shipCost-finOut;
  S.cash+=net;
  L.net=net; L.shipCostOut=shipCost;

  /* 지급불능 처리 */
  if(S.cash<0){
    const l=DB.finance.loans.find(x=>x.id==="l_short");
    const room=loanLimit(l);
    if(room>-S.cash){
      const amt=-S.cash;
      S.loans.push({type:l.id, balance:amt*(1+l.originFee), principalPerWeek:amt/l.term, paidInterest:0, opened:S.week});
      S.cash=0; pushLog(`현금 부족으로 ${l.name} ${won(amt)}원을 자동 실행했다.`,"warn");
    }else{
      S.insolvency++;
      pushLog(`지급불능 ${S.insolvency}주차. 한도 소진 상태.`,"risk");
      if(S.insolvency>=DB.config.insolvencyWeeks){ S.over="법정관리 개시 — 연속 지급불능으로 경영권을 상실했다."; }
    }
  } else S.insolvency=0;

  /* 5-8 이벤트 처리 ---------------------------------------------------- */
  S.active=S.active.filter(a=>a.until>S.week);
  DB.events.forEach(e=>{
    if(Math.random()<e.prob){
      if(e.eff.rate!=null) S.baseRate=clamp(S.baseRate+e.eff.rate,DB.finance.rateMin,DB.finance.rateMax);
      /* 현금 효과는 업종 시장규모가 아니라 자사 주간 운영비를 기준으로 산정한다.
         (시장규모 기준 시 점유율이 낮은 신생기업에 업계 전체 규모의 비용이 부과된다) */
      if(e.eff.cashRatio!=null){ const c=(opex+wage)*Math.abs(e.eff.cashRatio); S.cash+=e.eff.cashRatio<0?-c:c; }
      if(e.dur>0) S.active.push({id:e.id, until:S.week+e.dur});
      pushLog(`[${e.name}] ${e.msg}`, e.tag);
    }
  });

  /* 5-9 기록 ---------------------------------------------------------- */
  S.ledger=L;
  S.history.push({w:S.week, cash:S.cash, net, revenue, equity:equity(), thr:cap.throughput, produced, sold:soldQty});
  if(S.history.length>DB.config.historyKeep) S.history.shift();
  S.week++;
  if(S.over){ stopAuto(); }
  render();
}
function avgDefect(mid){
  const ids=Object.keys(S.contracts).filter(sid=>{
    const sp=S.suppliers.find(x=>x.id===sid); return sp&&sp.matId===mid;
  });
  if(!ids.length) return 0;
  return sum(ids.map(sid=>S.suppliers.find(x=>x.id===sid).defect))/ids.length;
}

function pipeWidget(cap){
  const ex=DB.externalConstraint;
  const max=Math.max(...DB.stages.map(s=>cap.vals[s.id]), cap.demand, 1)*DB.ui.barMaxRatio;
  const rows=DB.stages.map((s,i)=>{
    const v=cap.vals[s.id];
    const isNeck = v<=cap.throughput*DB.ui.neckThreshold;
    const util = v>0 ? Math.min(cap.throughput,cap.plan)/v : 0;
    return `<div class="prow">
      <div class="plabel">${i+1}. ${esc(s.short)}<em>${esc(s.name)}</em></div>
      <div class="track"><div class="fill ${isNeck?"neck":""}" style="width:${clamp(v/max*100,0,100)}%"></div>
        <div class="thr" style="left:${clamp(cap.throughput/max*100,0,100)}%"></div></div>
      <div class="pval">${num(v)}<em>가동 ${pct(util,0)} ${isNeck?"· 공정 병목":""}</em></div>
    </div>`;
  });
  const exNeck = cap.binding===ex.id;
  rows.push(`<div class="prow" style="margin-top:4px;padding-top:9px;border-top:1px dashed var(--line)">
    <div class="plabel">외. ${esc(ex.short)}<em>${esc(ex.name)}</em></div>
    <div class="track"><div class="fill ${exNeck?"neck":""}" style="width:${clamp(cap.demand/max*100,0,100)}%"></div>
      <div class="thr" style="left:${clamp(cap.throughput/max*100,0,100)}%"></div></div>
    <div class="pval">${num(cap.demand)}<em>${exNeck?"시장 제약":"내부 제약"}</em></div>
  </div>`);
  return `<div class="pipe">${rows.join("")}</div>`;
}
/* 파이프라인이 끊긴 구간을 지목해 다음 조치를 안내한다.
   (지표만 0으로 두면 원인을 역추적하기 어렵다 — 표현만 보강하고 로직은 그대로) */
function nextAction(cap){
  const r=[];
  if(!S.products.some(p=>p.active&&p.alloc>0))
    r.push(["상품 기획","양산 품목이 없다. 상품 기획 스튜디오에서 제품을 설계해 착수한다."]);
  if(cap.vals.source<=0)
    r.push(["원자재 수급","공급계약이 없어 자재가 들어오지 않는다. 협력사와 주간 물량을 계약한다."]);
  if(cap.vals.procure<=0)
    r.push(["인바운드 조달","입고·보관 설비가 없어 자재를 검사·적치할 수 없다."]);
  if(cap.vals.produce<=0)
    r.push(["공장 제작","필수 공정 그룹 중 설비가 비어 있는 구간이 있다."]);
  if(cap.routeCapa<=0)
    r.push(["운송·물류","계약된 운송 노선이 없어 출하가 불가능하다. 노선을 개설한다."]);
  else if(cap.outCapa<=0)
    r.push(["운송·물류","포장·출하 설비가 없어 노선에 실을 수 없다."]);
  if(!r.length) return "";
  return `<div class="neu-in" style="margin-top:11px;padding:11px 13px">
    <div class="sec-title" style="margin-bottom:7px">다음 조치</div>
    ${r.map(([t,m])=>`<div class="row"><span class="k">${tag("warn",t)} ${esc(m)}</span>
      <button class="btn sm" data-act="tab" data-tab="${DB.ui.tabs.find(x=>x.name===t).id}">이동</button></div>`).join("")}
  </div>`;
}
function bindingName(cap){
  return cap.binding===DB.externalConstraint.id
    ? DB.externalConstraint.name
    : DB.stages.find(s=>s.id===cap.binding).name;

function spark(arr,label){
  const w=DB.ui.sparkW,h=DB.ui.sparkH;
  if(arr.length<2) return `<div class="mini" style="margin-bottom:10px">${esc(label)} — 데이터 누적 중</div>`;
  const a=arr.slice(-DB.ui.sparkPoints), mn=Math.min(...a), mx=Math.max(...a), rg=(mx-mn)||1;
  const pts=a.map((v,i)=>`${(i/(a.length-1))*w},${h-((v-mn)/rg)*(h-8)-4}`).join(" ");
  return `<div style="margin-bottom:10px">
    <div class="mini" style="display:flex;justify-content:space-between"><span>${esc(label)}</span><span>${won(a[a.length-1])}</span></div>
    <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="g_${label.length}_${Math.round(mn)%97}" x1="0" x2="1">
        <stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--pink)"/></linearGradient></defs>
      <polyline points="${pts}" fill="none" stroke="url(#g_${label.length}_${Math.round(mn)%97})" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    </svg></div>`;
}

/* ── 1. 원자재 수급 ───────────────────────────────── */
function viewSource(cap){
  const sc=sec();
  const contracted=sum(Object.keys(S.contracts).map(k=>S.contracts[k]));
  const needKg=cap.throughput*sc.matPerUnit;
  return `<div class="grid g4">
    <div class="kpi neu-flat"><i>수급 CAPA</i><b class="${cap.neck==="source"?"dn":""}">${num(cap.vals.source)}</b><small>단위/주</small></div>
    <div class="kpi neu-flat"><i>주간 계약 물량</i><b>${num(contracted)}kg</b><small>소요 ${num(needKg)}kg</small></div>
    <div class="kpi neu-flat"><i>계약 협력사</i><b>${Object.keys(S.contracts).length}</b><small>구매인력 ${S.staff.lb_proc}명</small></div>
    <div class="kpi neu-flat"><i>입고 대기</i><b>${num(sum(S.inbound.map(b=>b.qty)))}kg</b><small>${S.inbound.length}건 운송중</small></div>
  </div>

  <div class="grid g2" style="margin-top:14px">
    <div class="card neu">
      <h3>원자재 시세 <span class="hint">주간 변동 · 계약 단가는 등급 계수 적용</span></h3>
      <table class="tbl"><thead><tr><th>원자재</th><th>기준</th><th>현재</th><th>변동</th><th>재고</th></tr></thead><tbody>
      ${sc.materials.map(mid=>{
        const m=M(mid), d=(S.matPrice[mid]/m.price-1);
        return `<tr><td>${esc(m.name)}</td><td>${num(m.price)}</td><td>${num(S.matPrice[mid])}</td>
        <td class="${d>=0?"dn":"up"}">${d>=0?"+":""}${pct(d,1)}</td>
        <td>${num(S.matStock[mid])} <span class="mini">(+${num(S.matRaw[mid])})</span></td></tr>`;
      }).join("")}
      </tbody></table>
      <div class="mini" style="margin-top:8px">재고 표기: 검사완료 (미검사 대기). 미검사 물량은 조달 CAPA만큼만 주간 처리된다.</div>

      <div class="sec-title" style="margin-top:16px">계약 현황 <span class="mini">자재별 소요 대비 계약 수준</span></div>
      ${Object.keys(S.contracts).length?`
      <table class="tbl"><thead><tr><th>자재</th><th>계약</th><th>주간 소요</th><th>의무 인수</th><th>재고 주수</th></tr></thead><tbody>
      ${sc.materials.map(mid=>{
        const ids=Object.keys(S.contracts).filter(id=>{const sp=S.suppliers.find(x=>x.id===id);return sp&&sp.matId===mid;});
        if(!ids.length) return "";
        const ctr=sum(ids.map(id=>S.contracts[id]));
        const must=sum(ids.map(id=>{
          const sp=S.suppliers.find(x=>x.id===id);
          return S.contracts[id]*DB.supplierGrades.find(g=>g.id===sp.gradeId).minTake;}));
        const req=(S.ledger&&S.ledger.reqByMat&&S.ledger.reqByMat[mid])||0;
        const stock=S.matStock[mid]+S.matRaw[mid];
        const wks=req>0?stock/req:null;
        const st=req<=0?"mute":(must>req*1.3?"warn":(ctr<req?"risk":"ok"));
        return `<tr><td>${esc(M(mid).name)}</td><td>${num(ctr)}</td><td>${num(req)}</td>
          <td>${num(must)} ${tag(st,must>req*1.3?"과다":(ctr<req?"부족":"적정"))}</td>
          <td>${wks==null?"-":dec(wks,1)+"주"}</td></tr>`;
      }).join("")}
      </tbody></table>
      <div class="mini" style="margin-top:7px">의무 인수가 주간 소요를 넘으면 초과분이 재고로 적체되고 현금이 묶인다.</div>`
      :`<div class="mini">체결된 공급계약이 없다. 우측에서 협력사와 주간 물량을 계약한다.</div>`}
    </div>

    <div class="card neu">
      <h3>협력사 계약 <span class="hint">등급별 단가·리드타임·불량률·공급능력이 다르다</span></h3>
      <div class="sub">계약 물량은 주간 고정 발주량이며 수급 CAPA에 즉시 반영된다.</div>
      <label class="fld"><span>원자재 선택</span>
        <select data-in="selmat">${sc.materials.map(mid=>`<option value="${mid}" ${S.selMat===mid?"selected":""}>${esc(M(mid).name)}</option>`).join("")}</select>
      </label>
      ${S.suppliers.filter(sp=>sp.matId===(S.selMat||sc.materials[0])).map(sp=>{
        const g=DB.supplierGrades.find(x=>x.id===sp.gradeId);
        const cur=S.contracts[sp.id]||0;
        const unit=curMatPrice(sp.matId)*sp.priceFactor;
        return `<div class="item neu-flat ${cur>0?"sel":""}">
          <div class="item-h"><b>${esc(sp.name)}</b><div class="tagrow">${tag(g.tag,g.name)}${cur>0?tag("accent","계약중"):""}</div></div>
          <div class="meta">
            <div>공급 단가<b>${num(unit)}원/kg</b></div>
            <div>리드타임<b>${sp.lead}주</b></div>
            <div>불량률<b>${pct(sp.defect,1)}</b></div>
            <div>주간 공급능력<b>${num(sp.capaKg)}kg</b></div>
            <div>최소 인수 의무<b>${pct(g.minTake,0)}</b></div>
            <div>의무 인수액<b>${won(cur*g.minTake*unit)}</b></div>
          </div>
          <div class="mini">소요와 무관하게 계약 물량의 ${pct(g.minTake,0)}는 인수·지급해야 한다. 과잉 계약은 재고로 적체된다.</div>
          <div class="slrow">
            <span class="nm">계약 물량</span>
            <input type="range" min="0" max="${Math.round(sp.capaKg)}" step="${Math.max(1,Math.round(sp.capaKg/100))}" value="${Math.round(cur)}" data-in="ctr" data-id="${sp.id}">
            <span class="vl" id="ctrv_${sp.id}">${num(cur)}</span>
          </div>
          <div class="row"><span class="k">주간 매입액 / 계약 수수료</span>
            <span class="v">${won(cur*unit)} / ${won(sp.capaKg*unit*g.fee)}</span></div>
          <div style="display:flex;gap:7px;margin-top:9px">
            <button class="btn sm primary" data-act="contract" data-id="${sp.id}">계약 확정</button>
            ${cur>0?`<button class="btn sm" data-act="uncontract" data-id="${sp.id}">해지(위약 ${pct(g.penalty,0)})</button>`:""}
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function draftProbe(){
  const d=S.draft, sc=sec();
  const p={id:"__draft", name:d.name, catId:d.catId, tierId:d.tierId, finishId:d.finishId,
           mix:d.mix, price:0, active:true, alloc:100, quality:0, sold:0, revenue:0, produced:0};
  p.quality=qualityOf(p);
  const s=suggestedPrice({...p, margin:d.margin});
  const price=d.priceOverride!=null&&d.priceOverride>0?d.priceOverride:s.price;
  p.price=price;
  const margin=(price-s.cost.total)/Math.max(1,price);
  const mine=S.products.filter(x=>x.active).map(productScore);
  const comp=sum(sc.competitors.map(competitorScore));
  const tot=sum(mine)+comp+productScore(p);
  const share=tot>0?productScore(p)/tot:0;
  const demand=sum(DB.markets.map(m=>marketPotential(m.id)*(hasRouteTo(m.id)?1:0)))*share;
  return {cost:s.cost, price, ref:s.ref, margin, quality:p.quality, tier:TIER(d.tierId), finish:FIN(d.finishId), demand};
}

/* ============================================================================
   [7] 인터랙션
   ========================================================================== */
function startAuto(){ if(autoTimer) return; S.running=true; autoTimer=setInterval(tick,DB.config.autoTickMs); }
function stopAuto(){ if(autoTimer){clearInterval(autoTimer);autoTimer=null;} if(S) S.running=false; }

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;

  if(act==="pick"){
    const inp=document.getElementById("companyNameInput");
    newGame(id, inp?inp.value:"");
    return;
  }
  if(act==="continueSave"){ const loaded=loadGame(); if(loaded){ S=loaded; render(); } return; }
  if(act==="restart"){ stopAuto(); clearSave(); S=null; render(); return; }
  if(act==="resetData"){
    if(window.confirm("저장된 데이터를 초기화하고 처음부터 시작한다. 되돌릴 수 없다. 계속할까?")){
      stopAuto(); clearSave(); S=null; render();
    }
    return;
  }
  if(!S) return;

  switch(act){
    case "saveNow":{
      saveGame(); pushLog("현재 상태를 브라우저에 저장했다.","mute"); render(); return;
    }
    case "tab": S.tab=el.dataset.tab; render(); return;
    case "tick": tick(); return;
    case "auto": S.running?stopAuto():startAuto(); render(); return;
    case "renameStart": S.editingName=true; render(); return;
    case "renameCancel": S.editingName=false; render(); return;
    case "renameConfirm":{
      const inp=document.getElementById("companyRenameInput");
      const v=inp?inp.value.trim():"";
      if(v) S.companyName=v;
      S.editingName=false; render(); return;
    }

    case "contract":{
      const sp=S.suppliers.find(x=>x.id===id);
      const inp=document.querySelector(`[data-in="ctr"][data-id="${id}"]`);
      const qty=inp?Number(inp.value):0;
      const g=DB.supplierGrades.find(x=>x.id===sp.gradeId);
      const fee=sp.capaKg*curMatPrice(sp.matId)*sp.priceFactor*g.fee;
      if(!S.contracts[id]){
        if(S.cash<fee){ pushLog("계약 수수료 부족으로 체결이 무산됐다.","risk"); break; }
        S.cash-=fee;
      }
      if(qty<=0){ delete S.contracts[id]; pushLog(`${sp.name} 계약 물량을 0으로 조정했다.`,"mute"); }
      else { S.contracts[id]=qty; pushLog(`${sp.name}와 ${M(sp.matId).name} 주간 ${num(qty)}kg 공급계약을 체결했다.`,"accent"); }
      break;
    }
    case "uncontract":{
      const sp=S.suppliers.find(x=>x.id===id), g=DB.supplierGrades.find(x=>x.id===sp.gradeId);
      const pen=(S.contracts[id]||0)*curMatPrice(sp.matId)*sp.priceFactor*g.penalty;
      S.cash-=pen; delete S.contracts[id];
      pushLog(`${sp.name} 계약을 해지했다. 위약금 ${won(pen)}원.`,"warn"); break;
    }
    case "selmat": break;

    case "buyeq":{
      const px=capexOf(id);
      if(S.cash<px){ pushLog("현금 부족으로 설비를 도입할 수 없다.","risk"); break; }
      S.cash-=px; S.equip[id]=(S.equip[id]||0)+1;
      pushLog(`${EQ(id).name} 1대를 증설했다. 취득원가 ${won(px)}원.`,"accent"); break;
    }
    case "selleq":{
      if(!(S.equip[id]>0)) break;
      const px=capexOf(id)*(1-DB.supplierGrades[0].penalty);
      S.equip[id]--; if(!S.equip[id]) delete S.equip[id];
      S.cash+=px; pushLog(`${EQ(id).name} 1대를 매각했다. 회수 ${won(px)}원.`,"mute"); break;
    }
    case "hire": S.staff[id]=(S.staff[id]||0)+Number(el.dataset.n); break;
    case "fire": S.staff[id]=Math.max(0,(S.staff[id]||0)-Number(el.dataset.n)); break;
    case "fill":{ const nd=laborNeed(); S.staff[id]=nd[id]||0; break; }

    case "route":{
      const rt=RT(id);
      if(S.routes[id]){ delete S.routes[id]; pushLog(`${rt.name} 계약을 해지했다.`,"mute"); }
      else{
        const fee=weeklyPotential(sec())*rt.feeRatio;
        if(S.cash<fee){ pushLog("계약 수수료 부족.","risk"); break; }
        S.cash-=fee; S.routes[id]=true; pushLog(`${rt.name} 노선을 개설했다. 수수료 ${won(fee)}원.`,"accent");
      }
      break;
    }

    case "normmix": normalizeMix(); break;
    case "qualmix": autoMix("q"); break;
    case "costmix": autoMix("c"); break;
    case "launch": launchProduct(); break;

    case "policy": S.policy=id; pushLog(`생산 계획 정책을 [${DB.production.policies.find(x=>x.id===id).name}]으로 변경했다.`,"accent"); break;
    case "toggleprod":{ const p=S.products.find(x=>x.id===id); p.active=!p.active; break; }
    case "repricePlus":{ const p=S.products.find(x=>x.id===id); p.price*=1.05; break; }
    case "repriceMinus":{ const p=S.products.find(x=>x.id===id); p.price*=0.95; break; }
    case "repriceCost":{
      const p=S.products.find(x=>x.id===id);
      p.price=unitCost(p).total*(1+p.margin);
      pushLog(`[${p.name}] 판가를 현재 원가 기준 마진율 ${pct(p.margin,0)}로 재산정했다. ${won(p.price)}원.`,"accent"); break;
    }

    case "deposit":{
      const dp=DB.finance.deposits.find(x=>x.id===id);
      const inp=document.querySelector(`[data-in="depamt"][data-id="${id}"]`);
      const amt=Number(inp&&inp.value)||0;
      if(amt<dp.minAmt){ pushLog(`${dp.name} 최소 가입금액 미달.`,"warn"); break; }
      if(amt>S.cash){ pushLog("현금 부족.","risk"); break; }
      S.cash-=amt; S.deposits.push({type:id, amount:amt, accrued:0, matures:S.week+dp.term, opened:S.week});
      pushLog(`${dp.name}에 ${won(amt)}원을 예치했다.`,"ok"); break;
    }
    case "withdraw":{
      const d=S.deposits[Number(id)]; const p=DB.finance.deposits.find(x=>x.id===d.type);
      const early=p.term>0&&S.week<d.matures;
      const pay=d.amount+d.accrued*(early?(1-p.earlyPenalty):1);
      S.cash+=pay; S.deposits.splice(Number(id),1);
      pushLog(`${p.name}을 ${early?"중도":"만기"} 해지했다. 수령 ${won(pay)}원.`,early?"warn":"ok"); break;
    }
    case "borrow":{
      const l=DB.finance.loans.find(x=>x.id===id);
      const inp=document.querySelector(`[data-in="loanamt"][data-id="${id}"]`);
      const amt=Number(inp&&inp.value)||0;
      if(amt<=0||amt>loanLimit(l)){ pushLog("차입 한도를 초과했다.","risk"); break; }
      const fee=amt*l.originFee;
      S.cash+=amt-fee;
      S.loans.push({type:id, balance:amt, principalPerWeek:amt/l.term, paidInterest:0, opened:S.week});
      pushLog(`${l.name} ${won(amt)}원을 실행했다. 수수료 ${won(fee)}원.`,"warn"); break;
    }
    case "repay":{
      const l=S.loans[Number(id)];
      if(S.cash<l.balance){ pushLog("상환 가능한 현금이 부족하다.","risk"); break; }
      S.cash-=l.balance; pushLog(`차입금 ${won(l.balance)}원을 전액 상환했다.`,"ok"); S.loans.splice(Number(id),1); break;
    }
    case "buybond":{
      const b=DB.finance.bonds.find(x=>x.id===id);
      const inp=document.querySelector(`[data-in="bondqty"][data-id="${id}"]`);
      const n=Math.floor(Number(inp&&inp.value)||0); if(n<=0) break;
      const cost=n*bondPrice(id)*(1+DB.finance.bondSpread);
      if(cost>S.cash){ pushLog("현금 부족.","risk"); break; }
      S.cash-=cost; S.bonds.push({bondId:id, units:n, matures:S.week+b.term, cost});
      pushLog(`${b.name} ${n}좌를 매수했다.`,"accent"); break;
    }
    case "sellbond":{
      const b=DB.finance.bonds.find(x=>x.id===id);
      const inp=document.querySelector(`[data-in="bondqty"][data-id="${id}"]`);
      let n=Math.floor(Number(inp&&inp.value)||0); if(n<=0) break;
      let proceeds=0;
      S.bonds=S.bonds.filter(h=>{
        if(h.bondId!==id||n<=0) return true;
        const take=Math.min(h.units,n); n-=take; h.units-=take;
        proceeds+=take*bondPrice(id)*(1-DB.finance.bondSpread);
        return h.units>0;
      });
      S.cash+=proceeds; pushLog(`${b.name}을 매도해 ${won(proceeds)}원을 회수했다.`,"mute"); break;
    }
    case "buystock":{
      const s=DB.finance.stocks.find(x=>x.id===id);
      const inp=document.querySelector(`[data-in="stockqty"][data-id="${id}"]`);
      const n=Math.floor(Number(inp&&inp.value)||0); if(n<=0) break;
      const cost=n*S.stockPrice[id]*(1+DB.finance.brokerFee);
      if(cost>S.cash){ pushLog("현금 부족.","risk"); break; }
      S.cash-=cost; S.stocks[id]+=n; pushLog(`${s.name} ${n}주를 매수했다.`,"accent"); break;
    }
    case "sellstock":{
      const s=DB.finance.stocks.find(x=>x.id===id);
      const inp=document.querySelector(`[data-in="stockqty"][data-id="${id}"]`);
      const n=Math.min(S.stocks[id],Math.floor(Number(inp&&inp.value)||0)); if(n<=0) break;
      const proceeds=n*S.stockPrice[id]*(1-DB.finance.brokerFee);
      S.cash+=proceeds; S.stocks[id]-=n; pushLog(`${s.name} ${n}주를 매도해 ${won(proceeds)}원을 회수했다.`,"mute"); break;
    }
  }
  render();
});

  if(k==="dcat"){ S.draft.catId=v; render(); }
  if(k==="dtier"){ S.draft.tierId=v; render(); }
  if(k==="dfin"){ S.draft.finishId=v; render(); }
  if(k==="alloc"||k==="cover") render();
  /* ctr(계약 물량 슬라이더)는 "계약 확정" 버튼으로만 S.contracts에 반영된다.
     여기서 render()를 호출하면 드래그를 놓는 순간 슬라이더가 아직 미확정 상태인
     이전 값으로 되돌아가 버려(당겨도 안 당겨지는 것처럼 보임), 값을 커밋할 기회조차
     없이 초기화되므로 change 시점에는 굳이 다시 그리지 않는다. */
});

/* 스튜디오 부분 갱신 — 제품명/원자재 비율/마진 입력 중에는 전체 뷰를 다시 그리지 않는다.
   input 이벤트마다 전체 HTML을 교체하면 방금 입력 중이던 텍스트 필드나 드래그 중인
   슬라이더가 매번 새 DOM 노드로 바뀌어 포커스·드래그가 끊긴다(제품명을 한 글자만
   쳐도 엔터를 친 것처럼 입력이 끊기는 현상의 원인). 그래서 입력값 자체를 담고 있는
   좌측 폼은 그대로 두고, 그 값에 파생되는 합계 표시·버튼 활성화·안내문·우측 "설계
   검토" 패널만 targeted하게 갱신한다. */
function refreshStudio(){
  if(S.tab!=="studio") return;
  const d=S.draft;
  const mixSum=sum(Object.keys(d.mix).map(k=>d.mix[k]));
  const probe=draftProbe();
  const mixSumEl=$("#mixSumTxt");
  if(mixSumEl) mixSumEl.textContent=`합계 ${mixSum}% ${mixSum===100?"":"(100% 필요)"}`;
  const launchBtn=$("#launchBtn");
  if(launchBtn) launchBtn.disabled=!d.name.trim()||mixSum!==100;
  const hints=$("#studioHints");
  if(hints) hints.innerHTML=studioHintsInner(d,mixSum);
  const review=$("#studioReview");
  if(review) review.innerHTML=studioReviewInner(d,probe);
}

function normalizeMix(){
  const d=S.draft, keys=Object.keys(d.mix);
  let t=sum(keys.map(k=>d.mix[k]));
  if(t<=0){ const per=Math.round(100/keys.length); keys.forEach((k,i)=>d.mix[k]=i===keys.length-1?100-per*(keys.length-1):per); return; }
  let acc=0;
  keys.forEach((k,i)=>{
    if(i===keys.length-1) d.mix[k]=100-acc;
    else { d.mix[k]=Math.round(d.mix[k]/t*100/DB.formulas.mixStep)*DB.formulas.mixStep; acc+=d.mix[k]; }
  });
  if(d.mix[keys[keys.length-1]]<0) d.mix[keys[keys.length-1]]=0;
}
function autoMix(mode){
  const sc=sec(), d=S.draft;
  const scored=sc.materials.map(mid=>({mid, v: mode==="q"?M(mid).q : 1/curMatPrice(mid)}));
  const tot=sum(scored.map(x=>x.v));
  let acc=0;
  scored.forEach((x,i)=>{
    if(i===scored.length-1) d.mix[x.mid]=100-acc;
    else { d.mix[x.mid]=Math.round(x.v/tot*100/DB.formulas.mixStep)*DB.formulas.mixStep; acc+=d.mix[x.mid]; }
  });
}
function launchProduct(){
  const d=S.draft, probe=draftProbe();
  const p={
    id:"p"+(S.seq++), name:d.name.trim(), catId:d.catId, tierId:d.tierId, finishId:d.finishId,
    mix:JSON.parse(JSON.stringify(d.mix)), margin:d.margin, price:probe.price,
    quality:probe.quality, active:true, alloc:S.products.length?0:100,
    coverage:DB.production.coverage.def,
    sold:0, revenue:0, produced:0, lastMade:0, lastPlan:0, unitCostNow:probe.cost.total, created:S.week
  };
  S.products.push(p); S.fg[p.id]=0; S.marketStock[p.id]={};
  pushLog(`신제품 [${p.name}] 양산에 착수했다. 판매가 ${won(p.price)}원, 품질지수 ${dec(p.quality,2)}.`,"pink");
  S.draft=newDraft(); S.tab="produce";
}

/* 기동 — 저장된 데이터가 있어도 곧바로 이어받지 않고, 선택 화면에서
   "이어하기"로 명시적으로 재개하게 한다(의도치 않은 복귀를 막는다). */
render();
